name: Build Android

on:
  workflow_dispatch:      # jalankan manual dari tab Actions
  push:
    tags:
      - "v*"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Android-

      - name: Unity build (Android)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: auto            # dibaca dari ProjectSettings/ProjectVersion.txt
          buildMethod: CIBuild.BuildAndroid
          buildName: SamuraiVsZombieDTP
          buildsPath: build
          versioning: None
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidPackage

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamuraiVsZombieDTP-android-${{ github.run_number }}
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 14
