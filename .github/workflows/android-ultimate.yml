name: Ultimate Android CI-CD

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      project_dir:
        description: 'Folder project Android di repository (digunakan bila project_zip kosong)'
        required: false
        default: '.'
        type: string
      project_zip:
        description: 'Path ZIP source Android di repository, contoh input/project.zip (opsional)'
        required: false
        default: ''
        type: string
      build_mode:
        description: 'Jenis build yang dijalankan'
        required: true
        default: 'all'
        type: choice
        options: [all, debug, release]
      java_version:
        description: 'JDK: auto atau 8, 11, 17, 21, 25'
        required: false
        default: 'auto'
        type: string
      gradle_version:
        description: 'Versi Gradle jika project tidak mempunyai Gradle Wrapper; contoh 8.14 atau current'
        required: false
        default: 'current'
        type: string
      compile_sdk:
        description: 'Override compileSdk jika tidak dapat dideteksi; contoh 35 atau 36'
        required: false
        default: ''
        type: string
      ndk_version:
        description: 'Override NDK version bila project memakai C/C++; kosong = deteksi / default'
        required: false
        default: ''
        type: string
      build_tools_version:
        description: 'Android Build Tools untuk signing; default 35.0.0'
        required: false
        default: '35.0.0'
        type: string
      publish_release:
        description: 'Buat GitHub Release setelah build dan signing berhasil'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Tag untuk manual release, contoh v1.0.0 (wajib jika publish_release aktif secara manual)'
        required: false
        default: ''
        type: string

concurrency:
  group: ultimate-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Detect, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      project_root: ${{ steps.prepare.outputs.project_root }}
      java_version: ${{ steps.detect.outputs.java_version }}
      build_tools_version: ${{ steps.config.outputs.build_tools_version }}
    env:
      BUILD_MODE: ${{ inputs.build_mode || 'all' }}
      PROJECT_DIR: ${{ inputs.project_dir || '.' }}
      PROJECT_ZIP: ${{ inputs.project_zip || '' }}
      JAVA_OVERRIDE: ${{ inputs.java_version || 'auto' }}
      GRADLE_OVERRIDE: ${{ inputs.gradle_version || 'current' }}
      COMPILE_SDK_OVERRIDE: ${{ inputs.compile_sdk || '' }}
      NDK_OVERRIDE: ${{ inputs.ndk_version || '' }}
      BUILD_TOOLS_VERSION: ${{ inputs.build_tools_version || '35.0.0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prepare project source (folder or ZIP)
        id: prepare
        run: |
          python scripts/prepare_project.py \
            --workspace "$GITHUB_WORKSPACE" \
            --project-dir "$PROJECT_DIR" \
            --project-zip "$PROJECT_ZIP"

      - name: Detect Android toolchain requirements
        id: detect
        run: |
          python scripts/detect_toolchain.py \
            --root "${{ steps.prepare.outputs.project_root }}" \
            --java-override "$JAVA_OVERRIDE" \
            --compile-sdk-override "$COMPILE_SDK_OVERRIDE" \
            --ndk-override "$NDK_OVERRIDE"

      - name: Resolve Android build configuration
        id: config
        run: |
          echo "build_tools_version=$BUILD_TOOLS_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected project root: ${{ steps.prepare.outputs.project_root }}"
          echo "Detected JDK: ${{ steps.detect.outputs.java_version }}"
          echo "Detected compileSdk: ${{ steps.detect.outputs.compile_sdk }}"
          echo "Detected NDK: ${{ steps.detect.outputs.ndk_version }}"
          echo "Native code: ${{ steps.detect.outputs.has_native }}"
          echo "Gradle wrapper: ${{ steps.detect.outputs.has_wrapper }}"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.detect.outputs.java_version }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install project Android SDK packages
        shell: bash
        env:
          COMPILE_SDK: ${{ steps.detect.outputs.compile_sdk }}
          HAS_NATIVE: ${{ steps.detect.outputs.has_native }}
          NDK_VERSION: ${{ steps.detect.outputs.ndk_version }}
          BUILD_TOOLS_VERSION: ${{ steps.config.outputs.build_tools_version }}
          CMAKE_VERSION: ${{ steps.detect.outputs.cmake_version }}
        run: |
          set -euo pipefail
          sdkmanager --list_installed || true
          PACKAGES=("platform-tools" "build-tools;${BUILD_TOOLS_VERSION}")
          if [[ -n "$COMPILE_SDK" ]]; then
            PACKAGES+=("platforms;android-${COMPILE_SDK}")
          else
            echo 'compileSdk belum dapat dideteksi; memasang platform android-35 sebagai fallback.'
            PACKAGES+=("platforms;android-35")
          fi
          if [[ "$HAS_NATIVE" == 'true' ]]; then
            if [[ -z "$NDK_VERSION" ]]; then NDK_VERSION='27.2.12479018'; fi
            if [[ -z "$CMAKE_VERSION" ]]; then CMAKE_VERSION='3.22.1'; fi
            PACKAGES+=("ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}")
          fi
          yes | sdkmanager "${PACKAGES[@]}"
          yes | sdkmanager --licenses >/dev/null
          echo 'Android SDK packages ready.'

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          gradle-version: ${{ steps.detect.outputs.has_wrapper == 'true' && 'wrapper' || env.GRADLE_OVERRIDE }}
          validate-wrappers: true

      - name: Run tests and build APK/AAB
        id: build
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.prepare.outputs.project_root }}
          BUILD_MODE: ${{ env.BUILD_MODE }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            GRADLE_CMD=(./gradlew)
          else
            GRADLE_CMD=(gradle)
          fi

          case "$BUILD_MODE" in
            debug)
              TASKS=(assembleDebug)
              ;;
            release)
              TASKS=(test assembleRelease bundleRelease)
              ;;
            all)
              TASKS=(test lint assembleDebug assembleRelease bundleRelease)
              ;;
            *)
              echo "Build mode tidak dikenal: $BUILD_MODE" >&2
              exit 2
              ;;
          esac

          mkdir -p "$GITHUB_WORKSPACE/dist/logs"
          printf 'Project root: %s\nBuild mode: %s\nTasks: %s\n' "$PROJECT_ROOT" "$BUILD_MODE" "${TASKS[*]}" | tee "$GITHUB_WORKSPACE/dist/logs/build-info.txt"
          set +e
          "${GRADLE_CMD[@]}" --no-daemon --stacktrace --console=plain "${TASKS[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/dist/logs/build.log"
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          exit "$BUILD_EXIT"

      - name: Collect APK/AAB and reports
        if: always()
        env:
          PROJECT_ROOT: ${{ steps.prepare.outputs.project_root }}
        run: |
          python scripts/collect_build_outputs.py \
            --root "$PROJECT_ROOT" \
            --output "$GITHUB_WORKSPACE/dist"

      - name: Diagnose build failure
        if: failure()
        run: python scripts/diagnose_failure.py --log dist/logs/build.log

      - name: Upload build outputs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-output
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  publish:
    name: Sign and publish Release
    needs: build
    if: >-
      ${{
        needs.build.result == 'success' &&
        (startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release == true))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: android-build-output
          path: dist

      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "release_tag wajib berformat vMAJOR.MINOR.PATCH, contoh v1.0.0. Nilai: '$RELEASE_TAG'" >&2
            exit 1
          fi

      - name: Set up JDK for AAB signing
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK for APK signing
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android Build Tools
        env:
          BUILD_TOOLS_VERSION: ${{ inputs.build_tools_version || '35.0.0' }}
        run: |
          yes | sdkmanager "build-tools;${BUILD_TOOLS_VERSION}"
          yes | sdkmanager --licenses >/dev/null

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing secret: ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing secret: ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing secret: ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing secret: ANDROID_KEY_PASSWORD'; exit 1; }
          test -d dist/release-to-sign || { echo 'Folder dist/release-to-sign tidak ditemukan.'; exit 1; }
          find dist/release-to-sign -maxdepth 1 -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit | grep -q . || {
            echo 'Tidak ada APK/AAB Release untuk ditandatangani. Pastikan build_mode=release atau all.'
            exit 1
          }

      - name: Sign APK and AAB
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: dist/release-to-sign
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ inputs.build_tools_version || '35.0.0' }}

      - name: Verify signatures and generate SHA-256
        env:
          BUILD_TOOLS_VERSION: ${{ inputs.build_tools_version || '35.0.0' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/release-to-sign/signingKey.jks
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          test -x "$APKSIGNER" || { echo "apksigner tidak ditemukan: $APKSIGNER" >&2; exit 1; }
          shopt -s nullglob
          APK_FILES=(dist/release-to-sign/*-signed.apk)
          AAB_FILES=(dist/release-to-sign/*.aab)
          if (( ${#APK_FILES[@]} == 0 && ${#AAB_FILES[@]} == 0 )); then
            echo 'Tidak ada file APK/AAB signed untuk diverifikasi.' >&2
            exit 1
          fi
          for apk in "${APK_FILES[@]}"; do
            echo "Verifying APK: $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
          for aab in "${AAB_FILES[@]}"; do
            echo "Verifying AAB: $aab"
            jarsigner -verify -verbose -certs "$aab" >/dev/null
            echo "AAB signature OK: $aab"
          done
          mkdir -p dist/checksums
          find dist/release-to-sign -maxdepth 1 -type f \
            \( -name '*-signed.apk' -o -name '*.aab' \) -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > dist/checksums/SHA256SUMS.txt
          test -s dist/checksums/SHA256SUMS.txt
          cat dist/checksums/SHA256SUMS.txt

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-signed-release
          path: |
            dist/release-to-sign/*-signed.apk
            dist/release-to-sign/*.aab
            dist/checksums/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event.repository.name }} ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release-to-sign/*-signed.apk
            dist/release-to-sign/*.aab
            dist/checksums/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
