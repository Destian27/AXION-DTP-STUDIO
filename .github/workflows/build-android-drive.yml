               ["Tidak ada pola error yang dikenali otomatis. Itu artinya penyebabnya bukan salah satu kasus umum, tetapi tetap tercatat apa adanya di bagian "
                "'Error persis dari log' di atas."],
               ["Buka link Run di atas, klik job 'Build APK', cari langkah bertanda silang merah.",
                "Buka langkah itu dan cari baris MERAH pertama (paling atas). Itu akar masalah; baris sesudahnya biasanya akibat.",
                "Salin 20 baris di sekitar baris merah pertama.",
                "Pakai teks di file prompt-perbaikan.txt (artifact error-report) sebagai bahan untuk meminta bantuan."],
               ["Setelah diperbaiki, langkah itu berubah hijau."],
               ["Hanya menyalin baris terakhir 'Process completed with exit code 1' (tidak informatif)."])


          # --------------------------------------------------------------------------- baca log
          SHOW_NUM = True  # nomor baris asli hanya ada kalau log lengkap berhasil diambil
          API = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")


          def clean(line):
              line = ANSI_RE.sub("", line.rstrip("\r\n"))
              line = CTRL_RE.sub("", line)
              return TS_RE.sub("", line)


          def parse_log(text):
              """-> list of dict(n, text, step, script). script=True untuk salinan isi 'run:' yang dicetak GitHub
              di awal tiap langkah; baris itu BUKAN output asli dan tidak boleh dianggap error."""
              out, step, in_script = [], "(awal job)", False
              for i, raw in enumerate(text.splitlines(), 1):
                  line = clean(raw)
                  m = re.match(r"##\[group\](.*)", line)
                  if m:
                      g = m.group(1).strip()
                      if g.startswith("Run ") or g.startswith("Post "):
                          step = g
                          in_script = g.startswith("Run ")
                  elif line.startswith("##[endgroup]"):
                      in_script = False
                  out.append(dict(n=i, text=line, step=step, script=in_script))
              return out


          # --- akses API GitHub.
          # Kenapa bukan 'gh api' saja: log job sering memuat escape sequence terminal, dan gh versi baru menolak
          # mencetaknya ("the response contains terminal escape sequences"). curl mengambil byte apa adanya.
          def _curl(url):
              token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN", "")
              cmd = ["curl", "-sS", "-L", "--max-time", "120", "--retry", "2", "--fail-with-body",
                     "-H", "Accept: application/vnd.github+json", "-H", "X-GitHub-Api-Version: 2022-11-28"]
              if token:
                  cmd += ["-H", f"Authorization: Bearer {token}"]
              cmd.append(url)
              r = subprocess.run(cmd, capture_output=True)
              if r.returncode != 0:
                  body = r.stdout[:200].decode("utf-8", "replace").replace("\n", " ")
                  raise RuntimeError(f"curl exit {r.returncode}: {r.stderr.decode('utf-8', 'replace').strip()[:200]} {body}".strip())
              return r.stdout


          def _gh_cli(path, allow_escape):
              cmd = ["gh", "api", "-H", "Accept: application/vnd.github+json"]
              if allow_escape:
                  cmd.append("--allow-escape-sequences")
              cmd.append(path)
              r = subprocess.run(cmd, capture_output=True)
              if r.returncode != 0:
                  raise RuntimeError(f"gh api exit {r.returncode}: {r.stderr.decode('utf-8', 'replace').strip()[:200]}")
              return r.stdout


          def api_get(path_or_url):
              """Ambil byte dari API. Urutan: curl, lalu gh dengan --allow-escape-sequences, lalu gh biasa (gh lama)."""
              url = path_or_url if path_or_url.startswith("http") else f"{API}/{path_or_url.lstrip('/')}"
              errs = []
              try:
                  return _curl(url)
              except Exception as e:
                  errs.append(str(e))
              path = url[len(API) + 1:] if url.startswith(API) else url
              for allow in (True, False):
                  try:
                      return _gh_cli(path, allow)
                  except Exception as e:
                      errs.append(str(e))
              raise RuntimeError(" | ".join(errs))


          def api_json(path_or_url):
              return json.loads(api_get(path_or_url).decode("utf-8", "replace"))


          def locate_job(repo, run_id, job_name):
              last = None
              for attempt in range(1, 4):
                  try:
                      jobs = api_json(f"repos/{repo}/actions/runs/{run_id}/jobs?per_page=100")["jobs"]
                      cand = [j for j in jobs if j["name"] == job_name] or [j for j in jobs if j.get("conclusion") == "failure"]
                      if not cand:
                          raise RuntimeError(f"job '{job_name}' tidak ditemukan; job tersedia: {[j['name'] for j in jobs]}")
                      return cand[0]
                  except Exception as e:
                      last = e
                      print(f"[diagnose] cari job, percobaan {attempt}/3: {e}")
                      time.sleep(5 * attempt)
              raise last


          def fetch_log_text(job):
              last = None
              for attempt in range(1, 5):
                  try:
                      text = api_get(f"repos/{job['_repo']}/actions/jobs/{job['id']}/logs").decode("utf-8", "replace")
                      if len(text) < 50:
                          raise RuntimeError("log masih kosong")
                      return text
                  except Exception as e:
                      last = e
                      print(f"[diagnose] ambil log, percobaan {attempt}/4: {e}")
                      time.sleep(6 * attempt)
              raise last


          def fetch_annotations(job):
              """Cadangan kalau log penuh tidak bisa diambil: anotasi ::error:: tiap job tersedia sebagai JSON biasa."""
              url = job.get("check_run_url") or f"{API}/repos/{job['_repo']}/check-runs/{job['id']}"
              items = api_json(url + "/annotations?per_page=100")
              lines = []
              for a in items:
                  if a.get("annotation_level") != "failure":
                      continue
                  title = (a.get("title") or "").strip()
                  msg = (a.get("message") or "").strip()
                  lines.append(f"##[error]{title}: {msg}" if title else f"##[error]{msg}")
              return lines


          # --------------------------------------------------------------------------- analisis
          def context(lines, idx, before=6, after=6):
              a, b = max(0, idx - before), min(len(lines), idx + after + 1)
              return lines[a:b]


          def gradle_block(lines):
              for i, l in enumerate(lines):
                  if not l["script"] and re.search(r"\* What went wrong", l["text"]):
                      blk = []
                      for x in lines[i:i + 16]:
                          if re.search(r"\* Try:", x["text"]):
                              break
                          blk.append(x)
                      return blk
              return []


          def batchmode_block(lines):
              for i, l in enumerate(lines):
                  if not l["script"] and "Aborting batchmode due to failure" in l["text"]:
                      blk = [l]
                      for x in lines[i + 1:i + 12]:
                          if x["text"].startswith("##[") or not x["text"].strip():
                              break
                          blk.append(x)
                      return blk
              return []


          def collect_cs(lines):
              seen, res = set(), []
              for l in lines:
                  if l["script"]:
                      continue
                  m = CS_ERR_RE.search(l["text"])
                  if not m:
                      continue
                  key = (m["file"], m["line"], m["col"], m["code"])
                  if key in seen:
                      continue
                  seen.add(key)
                  res.append(dict(file=m["file"].strip(), line=int(m["line"]), col=int(m["col"]),
                                  code=m["code"], msg=m["msg"].strip(), log_line=l["n"]))
              return res


          def analyze(lines):
              findings = []
              for r in R:
                  hit = None
                  for l in lines:
                      if l["script"]:
                          continue
                      if any(rx.search(l["text"]) for rx in r["rx"]):
                          hit = l
                          break
                  if hit:
                      findings.append(dict(rule=r, first=hit,
                                           ctx=[x for x in context(lines, hit["n"] - 1, 10, 25) if not x["script"] and not x["text"].startswith(("##[endgroup]", "##[group]"))]))
              err_lines = [l for l in lines if not l["script"] and l["text"].startswith("##[error]")]
              findings.sort(key=lambda f: (f["rule"]["sev"], f["first"]["n"]))
              primary = None
              tag = next((l for l in lines if not l["script"] and l["text"].startswith("FETCH_ERROR[")), None)
              if tag:  # skrip fetch menyebut kode pastinya: itu penentu
                  for f in findings:
                      if any(rx.search(tag["text"]) for rx in f["rule"]["rx"]):
                          primary = f
                          break
              if findings and not primary:
                  sev_min = min(f["rule"]["sev"] for f in findings)
                  pool = [f for f in findings if f["rule"]["sev"] == sev_min]
                  primary = min(pool, key=lambda f: f["first"]["n"])
              return findings, primary, err_lines


          def fetch_details(lines):
              return [l["text"].replace("FETCH_DETAIL ", "", 1) for l in lines
                      if not l["script"] and l["text"].startswith("FETCH_DETAIL ")]


          RAW_ERR_RE = re.compile(
              r"^##\[error\]|^FETCH_ERROR\[|^FETCH_DETAIL |error CS\d{4}|^\s*(?:Unhandled )?Exception\b|FAILURE:|"
              r"\* What went wrong|Aborting batchmode|Build Player Failed|No valid Unity Editor license|^LICENSE_MISSING|"
              r"Fatal Error|^Traceback|\[CIBuild\].*(?:gagal|tidak ada|tidak ditemukan|Exception|error)|"
              r"CommandInvokationFailure|Error building Player|Duplicate class|Could not resolve|"
              r"minSdkVersion .* cannot be smaller|IL2CPP error|Shader error in", re.I)


          def raw_errors(lines, limit=200):
              out, seen = [], set()
              for l in lines:
                  if l["script"] or l["text"].startswith("##[warning]"):
                      continue
                  if RAW_ERR_RE.search(l["text"]):
                      key = l["text"][:300]
                      if key in seen:
                          continue
                      seen.add(key)
                      out.append(l)
                      if len(out) >= limit:
                          break
              return out


          # --------------------------------------------------------------------------- laporan (hanya error)
          FETCH_RULES = {"SCENE_MISSING", "DRIVE_DOWNLOAD", "ARCHIVE_UNKNOWN", "NO_UNITY_PROJECT", "ARCHIVE_CORRUPT", "DRIVE_PERMISSION",
                         "DRIVE_QUOTA", "DRIVE_NOT_FOUND", "URL_BAD", "URL_EMPTY", "ARCHIVE_PASSWORD"}


          def fmt_lines(ls, limit=60):
              ls = ls[:limit]
              if SHOW_NUM:
                  return "\n".join(f"[{l['n']:>5}] {l['text'][:500]}" for l in ls)
              return "\n".join(l["text"][:500] for l in ls)


          def render_finding(f, n, is_primary, lines):
              r = f["rule"]
              d = DEEP.get(r["id"])
              md = []
              mark = "  (PENYEBAB UTAMA)" if is_primary else "  (error lanjutan / akibat)"
              md.append(f"## :x: Error {n}: {r['title']}{mark}")
              md.append("")
              where = (f"baris log {f['first']['n']}, langkah `{f['first']['step']}`" if SHOW_NUM
                       else "nomor baris tidak tersedia (laporan dari anotasi run)")
              md.append(f"**Kategori:** {r['cat']}  ")
              md.append(f"**Lokasi:** {where}")
              md.append("")
              md += ["### Error persis dari log", "", "```text", fmt_lines(f["ctx"], 60), "```", ""]
              if r["id"] in FETCH_RULES:
                  det = fetch_details(lines)
                  if det:
                      md += ["### Detail dari skrip pengunduh", "", "```text", *det[:40], "```", ""]
              if r["id"] in ("GRADLE_FAIL", "BATCHMODE_ABORT") or is_primary:
                  gb, bb = gradle_block(lines), batchmode_block(lines)
                  if gb:
                      md += ["### Blok Gradle 'What went wrong'", "", "```text", fmt_lines(gb), "```", ""]
                  if bb:
                      md += ["### Alasan Unity berhenti", "", "```text", fmt_lines(bb), "```", ""]
              if d:
                  md += ["### Kenapa ini terjadi", ""]
                  for p in d["why"]:
                      md += [p, ""]
                  md += ["### Cara memperbaiki (urut, jangan loncat)", ""]
                  for i, s in enumerate(d["steps"], 1):
                      md.append(f"{i}. {s}")
                  md += ["", "### Cara memastikan sudah beres", ""]
                  md += [f"- {v}" for v in d["verify"]]
                  md += ["", "### Kesalahan yang sering terjadi saat memperbaiki", ""]
                  md += [f"- {p}" for p in d["pitfalls"]]
                  md.append("")
              else:
                  md += ["### Kenapa ini terjadi", "", r["cause"], "", "### Cara memperbaiki", ""]
                  md += [f"{i}. {s}" for i, s in enumerate(r["fix"], 1)]
                  md.append("")
              return md


          def make_prompt(meta, failed_steps, findings, cs, raws):
              p = ["Build GitHub Actions saya gagal. Tolong cari akar masalah dan perbaiki sampai berhasil.",
                   f"Repo: {meta.get('repo', '?')}"]
              if meta.get("run_url"):
                  p.append(f"Run: {meta['run_url']}")
              p.append(f"Langkah gagal: {', '.join(failed_steps) if failed_steps else '(tidak diketahui)'}")
              if findings:
                  p.append("Error terdeteksi: " + "; ".join(f["rule"]["title"] for f in findings))
              if cs:
                  p.append("Error C#:")
                  p += [f"- {e['file']}({e['line']},{e['col']}) {e['code']}: {e['msg'][:200]}" for e in cs[:30]]
              p += ["", "Baris error dari log:", "```"]
              p += [l["text"][:400] for l in raws[:80]]
              p += ["```", "",
                    "Yang saya mau: jelaskan penyebab detailnya, lalu berikan file hasil perbaikan LENGKAP "
                    "(workflow/skrip/kode) yang bisa langsung saya pakai."]
              return "\n".join(p)


          def make_report(lines, failed_steps, meta, findings, primary, err_lines):
              cs = collect_cs(lines)
              raws = raw_errors(lines)
              md = []
              js = {"meta": meta, "failed_steps": failed_steps, "cs_errors": cs}
              ordered = ([primary] if primary else []) + [f for f in findings if f is not primary]
              total = len(ordered) + (1 if cs and not any(f["rule"]["id"] == "COMPILE_ERRORS" for f in ordered) else 0)

              md.append("# :rotating_light: Error Build - laporan lengkap")
              md.append("")
              if failed_steps:
                  md.append(f"**Langkah yang gagal:** `{'`, `'.join(failed_steps)}`  ")
              if meta.get("run_url"):
                  md.append(f"**Run:** {meta['run_url']}  ")
              md.append(f"**Jumlah error terdeteksi:** {total if total else 'tidak dikenali otomatis (lihat bagian bawah)'}")
              if meta.get("note"):
                  md += ["", f"_{meta['note']}_"]
              md.append("")
              if len(ordered) > 1:
                  md.append("**Daftar error:**")
                  md += [f"{i}. {f['rule']['title']}" for i, f in enumerate(ordered, 1)]
                  md.append("")

              if not ordered and not cs:
                  first_err = err_lines[0] if err_lines else None
                  ctx = context(lines, (first_err["n"] - 1) if first_err else max(0, len(lines) - 60), 25, 25)
                  md += ["## :x: Error: penyebab tidak dikenali otomatis", "",
                         "### Error persis dari log", "", "```text", fmt_lines(ctx, 80), "```", ""]
                  d = DEEP["UNKNOWN"]
                  md += ["### Kenapa ini terjadi", ""] + d["why"] + [""]
                  md += ["### Cara memperbaiki (urut, jangan loncat)", ""] + [f"{i}. {s}" for i, s in enumerate(d["steps"], 1)] + [""]
                  md += ["### Cara memastikan sudah beres", ""] + [f"- {v}" for v in d["verify"]] + [""]
                  md += ["### Kesalahan yang sering terjadi saat memperbaiki", ""] + [f"- {v}" for v in d["pitfalls"]] + [""]
              else:
                  for i, f in enumerate(ordered, 1):
                      md += render_finding(f, i, f is primary, lines)

              if cs:
                  md.append(f"## :x: Error kompilasi C# ({len(cs)} error)")
                  md += ["", "Perbaiki dari yang paling atas; satu error sering memunculkan banyak error turunan.", "",
                         "| File | Baris | Kode | Pesan |", "|---|---|---|---|"]
                  for e in cs:
                      msg = e["msg"].replace("|", "\\|")[:300]
                      md.append(f"| `{e['file']}` | {e['line']}:{e['col']} | {e['code']} | {msg} |")
                  md += ["", "**Arti kode error:**"]
                  for c in sorted({e["code"] for e in cs}):
                      md.append(f"- **{c}** - {CS_HINTS.get(c, 'Cari kode ini di docs.microsoft.com/dotnet/csharp/language-reference/compiler-messages.')}")
                  md.append("")

              if raws:
                  md += ["## Semua baris error mentah dari log", "",
                         "Disalin apa adanya (tanpa dipotong, duplikat dibuang):", "",
                         "```text", fmt_lines(raws, 200), "```", ""]
              md.append("<sub>Dibuat otomatis oleh job Diagnosa Error. Hanya memuat error; peringatan (warning) tidak dimasukkan.</sub>")

              js["primary"] = primary["rule"]["id"] if primary else None
              js["findings"] = [dict(id=f["rule"]["id"], title=f["rule"]["title"], line=f["first"]["n"], step=f["first"]["step"])
                                for f in ordered]
              prompt = make_prompt(meta, failed_steps, ordered, cs, raws)
              js["prompt"] = prompt
              return "\n".join(md), js, prompt


          def total_failure_report(meta, failed_steps, reasons):
              md = ["# :rotating_light: Error Build - log tidak bisa dibaca otomatis", ""]
              if failed_steps:
                  md.append(f"**Langkah yang gagal (dari API):** `{'`, `'.join(failed_steps)}`  ")
              if meta.get("run_url"):
                  md.append(f"**Run:** {meta['run_url']}  ")
              md += ["", "## :x: Error: job diagnosa tidak bisa mengambil log maupun anotasi", "",
                     "### Pesan error persis", "", "```text", *reasons, "```", "",
                     "### Cara memperbaiki (urut, jangan loncat)", "",
                     "1. Buka link Run di atas, klik job 'Build APK', buka langkah yang bertanda silang merah, salin baris merah paling atas.",
                     "2. Pastikan job diagnosa punya `permissions:` berikut: `actions: read`, `contents: read`, `checks: read` (sudah ada di workflow ini; "
                     "jika kamu mengubah blok permissions, jangan hapus ketiganya).",
                     "3. Jika repo di organisasi: Settings > Actions > General > Workflow permissions harus mengizinkan token membaca Actions.",
                     "4. Jika pesan menyebut 'terminal escape sequences': workflow versi ini sudah memakai curl sehingga tidak terkena; "
                     "pastikan kamu memakai file workflow terbaru.",
                     "5. Jika pesan menyebut 'rate limit' atau 5xx: tunggu beberapa menit lalu Re-run all jobs.", ""]
              return "\n".join(md)


          # --------------------------------------------------------------------------- main
          def main():
              global SHOW_NUM
              ap = argparse.ArgumentParser()
              ap.add_argument("--log-file")
              ap.add_argument("--repo", default=os.environ.get("GITHUB_REPOSITORY", ""))
              ap.add_argument("--run-id", default=os.environ.get("GITHUB_RUN_ID", ""))
              ap.add_argument("--job-name", default="")
              ap.add_argument("--out", default="error-report")
              args = ap.parse_args()

              failed_steps, meta, text = [], {"repo": args.repo}, None
              summ = os.environ.get("GITHUB_STEP_SUMMARY")
              if args.log_file:
                  with open(args.log_file, encoding="utf-8", errors="replace") as f:
                      text = f.read()
              else:
                  server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
                  meta["run_url"] = f"{server}/{args.repo}/actions/runs/{args.run_id}"
                  reasons = []
                  job = None
                  try:
                      job = locate_job(args.repo, args.run_id, args.job_name)
                      job["_repo"] = args.repo
                      meta["job"] = job["name"]
                      meta["job_url"] = job.get("html_url", "")
                      failed_steps = [s["name"] for s in job.get("steps", []) if s.get("conclusion") == "failure"]
                  except Exception as e:
                      reasons.append(f"Cari job: {e}")
                  if job:
                      try:
                          text = fetch_log_text(job)
                      except Exception as e:
                          reasons.append(f"Ambil log: {e}")
                          print(f"::warning title=Log penuh tidak bisa diambil::{str(e)[:200]}")
                          try:
                              ann = fetch_annotations(job)
                              if ann:
                                  text = "\n".join(ann)
                                  SHOW_NUM = False
                                  meta["note"] = ("Log penuh tidak bisa diambil, jadi laporan disusun dari anotasi error pada run "
                                                  "(isinya tetap pesan error yang sama).")
                              else:
                                  reasons.append("Anotasi error: kosong")
                          except Exception as e2:
                              reasons.append(f"Ambil anotasi: {e2}")
                  if text is None:
                      msg = total_failure_report(meta, failed_steps, reasons or ["(tidak ada keterangan)"])
                      print("::error title=DIAGNOSA GAGAL::" + " | ".join(reasons)[:300])
                      open(args.out + ".md", "w", encoding="utf-8").write(msg)
                      if summ:
                          open(summ, "a", encoding="utf-8").write(msg + "\n")
                      print(msg)
                      return 0

              lines = parse_log(text)
              findings, primary, err_lines = analyze(lines)
              md, js, prompt = make_report(lines, failed_steps, meta, findings, primary, err_lines)

              open(args.out + ".md", "w", encoding="utf-8").write(md)
              json.dump(js, open(args.out + ".json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
              open("prompt-perbaikan.txt", "w", encoding="utf-8").write(prompt)
              if summ:
                  with open(summ, "a", encoding="utf-8") as f:
                      f.write(md[:900_000] + "\n")

              # anotasi ringkas di halaman run
              if primary:
                  r = primary["rule"]
                  print(f"::error title=PENYEBAB UTAMA - {r['title']}::{r['cause'][:200]}")
              for e in js["cs_errors"][:10]:
                  print(f"::error file={e['file']},line={e['line']},col={e['col']},title={e['code']}::{e['msg'][:200]}")
              print(md)
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          python3 "$RUNNER_TEMP/diagnose.py" \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --job-name "Build APK" \
            --out error-report

      - name: Simpan laporan (artifact)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: error-report-${{ github.run_number }}
          path: |
            error-report.md
            error-report.json
            prompt-perbaikan.txt
          if-no-files-found: ignore
          retention-days: 14
