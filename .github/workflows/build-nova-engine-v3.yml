          ]
          ATTEMPT = re.compile(r"^=== (.+?), percobaan (\d+) ===")
          NOISE = ("Compiling ", "Linking ", "Generating ", "Creating ", "Archiving ", "Indexing ", "Copying ", "[Initial build]")


          def find_errors(lines, start=0, end=None):
              end = len(lines) if end is None else end
              res = []
              for i in range(start, end):
                  l = lines[i]
                  if not l or l.startswith(("##[nova]",) + NOISE):
                      continue
                  for kind, rx in STRONG:
                      if rx.search(l):
                          res.append((i, kind, l))
                          break
              return res


          def split_attempts(lines):
              marks = [(i, int(m.group(2)), m.group(1)) for i, l in enumerate(lines) for m in [ATTEMPT.match(l)] if m]
              if not marks:
                  return [(0, "keseluruhan", 0, len(lines))]
              out = []
              for n, (i, num, nm) in enumerate(marks):
                  j = marks[n + 1][0] if n + 1 < len(marks) else len(lines)
                  out.append((num, nm, i, j))
              return out


          def norm_sig(l):
              l = re.sub(r"/home/runner/work/\S+?/\S+?/", "", l)
              l = re.sub(r"\d{4}-\d\d-\d\dT[\d:.]+Z?", "T", l)
              l = re.sub(r"0x[0-9a-fA-F]+|\b\d+\b", "N", l)
              return l.strip()[:200]


          def gradle_blocks(lines):
              wrong, caused, tasks = [], [], []
              for i, l in enumerate(lines):
                  if l.startswith("* What went wrong:"):
                      blk, j = [], i + 1
                      while j < len(lines) and j - i < 70 and not lines[j].startswith(("* Try:", "* Exception is:", "* Get more help", "::error", "::warning", "##[nova]", "=== ", "BUILD FAILED")):
                          blk.append(lines[j])
                          j += 1
                      wrong.append((i + 1, blk))
                  m = re.match(r"^> Task (\S+) FAILED", l)
                  if m:
                      tasks.append((i + 1, m.group(1)))
                  if l.lstrip().startswith("Caused by:"):
                      caused.append((i + 1, l.strip()))
              return wrong, caused, tasks


