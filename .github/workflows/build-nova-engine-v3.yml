name: Build Nova Engine APK v3

# ============================================================================
# Build APK editor Nova Engine (arm64) — versi 3
# Simpan sebagai: .github/workflows/build-nova-engine-v3.yml
#
# CARA PAKAI (dari HP juga bisa):
#   Actions -> "Build Nova Engine APK v3" -> Run workflow
#   Muncul dialog (modal) berisi isian:
#     - Link Drive / URL : tempel link Google Drive (file ZIP atau folder)
#                          atau URL langsung ke arsip. Kosongkan kalau source
#                          sudah ada di repo ini.
#     - Versi            : opsional. Kosong = dibaca otomatis dari source.
#
# Syarat link Google Drive:
#   Bagikan dengan akses "Siapa saja yang memiliki link" (Anyone with the link).
#   Kalau tidak, Drive mengirim halaman login dan workflow berhenti dengan
#   pesan error yang jelas.
#
# Format arsip yang diekstrak otomatis:
#   .zip  .tar  .tar.gz/.tgz  .tar.xz  .tar.bz2  .7z  .rar (rar: best-effort)
#   Isi arsip boleh berada di dalam folder bertingkat (mis. godot-master/);
#   folder root source dicari otomatis (yang punya SConstruct + gradlew).
#
# Hasil:
#   1) Artifact "DTP-Nova-Engine-<versi>-apk" di halaman run
#   2) GitHub Release (mudah diunduh dari HP) — tab Releases
#   3) Kalau gagal: artifact "nova-engine-log-gagal" berisi log untuk dianalisis
#
# Tanda tangan APK:
#   Isi secret ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD +
#   ANDROID_KEY_ALIAS supaya tanda tangan SAMA tiap build (bisa update tanpa
#   uninstall). Kalau kosong -> keystore sementara dibuat otomatis.
#
# Perbaikan (run #2 gagal): step "Install Android SDK / NDK" sekarang mencari
# sdkmanager sendiri dan mengunduh command-line tools bila tidak ada di runner.
# Versi action dinaikkan (checkout v6, setup-java v5, setup-python v6,
# upload-artifact v6) supaya peringatan Node.js 20 / setup-java v4 hilang.
#
# Perbaikan (run #5 gagal): link Drive yang ditempel menunjuk ke folder yang
# HANYA berisi file workflow (build-nova-engine-v3.yml), bukan Nova-engine.zip,
# sehingga tidak ada source yang bisa diekstrak. Langkah "Ambil dan ekstrak
# source" sekarang mendeteksi kasus ini dan menulis pesan error yang jelas
# (isi folder yang terunduh + apa yang harus diunggah), dan diagnosis di laporan
# error diperbarui. Alur build lainnya sudah dicocokkan dengan source di
# Nova-engine.zip (SDK 36 / build-tools 36.1.0 / NDK 29.0.14206865 / Java 17 /
# Gradle task generateGodotEditor / APK android_editor-android-release).
#
# Perbaikan (run #7 gagal): SCons dijalankan tanpa store_release=yes, sehingga
# libgodot_android.so ditaruh di lib/libs/tools/DEBUG dan Gradle
# generateGodotEditor hanya membuat android_editor-android-debug.apk/.aab. Langkah
# verifikasi mencari APK *release* -> "APK release tidak ditemukan".
# Sekarang perintah scons memakai store_release=yes (lihat platform/android/SCsub)
# dan ada pengecekan .so release segera setelah kompilasi (gagal cepat + jelas).
#
# FITUR BARU — LAPORAN ERROR LENGKAP (.txt), otomatis saat build GAGAL:
#   Isi laporan:
#     - langkah mana yang gagal, di tahap berapa dari 9, durasi tiap langkah
#     - error PERTAMA (akar masalah) + konteks log, "What went wrong" Gradle,
#       rantai "Caused by", task Gradle yang gagal
#     - file:baris di source beserta potongan kodenya (mis. core/foo.cpp:4)
#     - diagnosis otomatis: KENAPA bisa error + CARA memperbaikinya (±25 pola)
#     - apakah error SAMA di 3 percobaan (permanen) atau berubah (sementara)
#     - info runner: disk, RAM, versi Java/Python/SCons/SDK/NDK, isi bin/,
#       jejak OOM (dmesg), log daemon Gradle, ekor log langkah yang gagal
#   Hasilnya ada di 4 tempat (pilih yang paling gampang dari HP):
#     1) Halaman run -> Summary: kotak kode dengan tombol SALIN
#     2) Artefak "LAPORAN-ERROR-NOVA-ENGINE-run<N>.txt" (.txt langsung, tidak di-zip)
#     3) Tab Releases -> "[GAGAL] Laporan error ..." (file .txt; 5 terbaru disimpan,
#        yang lebih lama dihapus otomatis — hanya tag berawalan nova-error-run)
#     4) Artefak "nova-engine-log-gagal": laporan + log mentah tiap langkah
#   Password keystore, token, dan ID Drive otomatis disamarkan (***).
#   Cara kerja: semua langkah "run" dijalankan lewat pembungkus /usr/local/bin/nova-sh
#   (dibuat di langkah pertama) yang menyalin outputnya ke log per-langkah.
#
# Catatan: workflow ini hanya jalan manual (tidak otomatis tiap push), supaya
# repo kecil yang hanya berisi file ini tidak memicu build yang pasti gagal.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Link Google Drive (FILE Nova-engine.zip atau folder berisi ZIP itu) / URL arsip (mis. link GitHub Release). Kosong = pakai repo"
        required: false
        type: string
        default: ""
      app_version:
        description: "Versi untuk nama file. Kosong = baca otomatis dari source"
        required: false
        type: string
        default: ""

concurrency:
  group: nova-engine-build
  cancel-in-progress: false

permissions:
  contents: write
  actions: read      # untuk membaca nama/durasi langkah di laporan error

defaults:
  run:
    # Pembungkus yang dibuat di langkah pertama: sama seperti bash -eo pipefail,
    # tetapi juga merekam output tiap langkah untuk laporan error.
    shell: /usr/local/bin/nova-sh {0}

env:
  # NILAI CADANGAN SAJA. Versi sebenarnya dibaca otomatis dari source
  # (config.gradle, detect.py, editor/build.gradle) pada langkah
  # "Baca versi toolchain dari source".
  ANDROID_PLATFORM: android-36
  ANDROID_BUILD_TOOLS: 36.1.0
  ANDROID_NDK: 29.0.14206865

jobs:
  build-nova-engine:
    name: Build APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    steps:
      - name: Lapangkan ruang disk
        id: disk
        shell: bash   # langkah ini yang membuat pembungkus nova-sh
        run: |
          # Buat pembungkus shell (merekam log tiap langkah untuk laporan error)
          sudo tee /usr/local/bin/nova-sh >/dev/null <<'NOVASH'
          #!/usr/bin/env bash
          # nova-sh: pembungkus shell. Menjalankan skrip langkah persis seperti
          # "bash -eo pipefail" dan menyalin SEMUA output ke log per-langkah
          # ($RUNNER_TEMP/nova-steplogs/<id-langkah>.log) untuk laporan error.
          SCRIPT="$1"
          LOGDIR="${RUNNER_TEMP:-/tmp}/nova-steplogs"
          mkdir -p "$LOGDIR" 2>/dev/null || true
          ID="${GITHUB_ACTION:-langkah}"
          ID="${ID//[^A-Za-z0-9_.-]/_}"
          LOG="$LOGDIR/$ID.log"
          echo "##[nova] step=$ID mulai=$(date -u +%FT%TZ)" >> "$LOG" 2>/dev/null || true
          bash --noprofile --norc -eo pipefail "$SCRIPT" 2>&1 | tee -a "$LOG"
          rc="${PIPESTATUS[0]}"
          echo "##[nova] step=$ID selesai=$(date -u +%FT%TZ) exit=$rc" >> "$LOG" 2>/dev/null || true
          exit "$rc"
          NOVASH
          sudo chmod +x /usr/local/bin/nova-sh
          mkdir -p "$RUNNER_TEMP/nova-steplogs"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install SCons dan gdown
        id: pip
        run: python -m pip install "scons>=4.4,<5" zstandard "gdown==5.2.0"

      # ---------------------------------------------------------------
      # Ambil source: dari link Drive / URL (diunduh, diekstrak otomatis)
      # atau dari isi repo bila link dikosongkan.
      # Link dibaca lewat env (bukan disisipkan ke skrip) supaya aman.
      # ---------------------------------------------------------------
      - name: Ambil dan ekstrak source
        id: source
        env:
          DRIVE_URL: ${{ inputs.drive_url }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/logs"
          DL="$RUNNER_TEMP/dl"
          EX="$RUNNER_TEMP/ex"
          rm -rf "$DL" "$EX"
          mkdir -p "$DL" "$EX"

          # Buang spasi/baris baru tersembunyi bawaan paste dari HP.
          URL="$(printf '%s' "$DRIVE_URL" | tr -d '[:space:]')"

          # Cari folder root source: harus ada SConstruct + version.py +
          # platform/android/java/gradlew. Diambil yang paling dangkal.
          find_root() {
            find "$@" -maxdepth 6 -type f -name SConstruct \
                 -not -path '*/__MACOSX/*' -print0 2>/dev/null \
            | while IFS= read -r -d '' s; do
                d="$(dirname "$s")"
                if [ -f "$d/version.py" ] && [ -f "$d/platform/android/java/gradlew" ]; then
                  echo "$d"
                fi
              done \
            | awk '{ print length($0) " " $0 }' | sort -n | sed -n '1p' | cut -d' ' -f2- || true
          }

          ensure_7z() {
            if ! command -v 7z >/dev/null 2>&1; then
              sudo apt-get update -qq || true
              sudo apt-get install -y -qq p7zip-full >/dev/null || sudo apt-get install -y -qq 7zip >/dev/null || true
            fi
            if command -v 7z >/dev/null 2>&1; then echo 7z
            elif command -v 7zz >/dev/null 2>&1; then echo 7zz
            elif command -v 7za >/dev/null 2>&1; then echo 7za
            else return 1; fi
          }

          # Ekstrak satu arsip (jenis dikenali dari isi file, bukan dari nama).
          extract_one() {
            local f="$1" out="$2" mt rc
            mt="$(file -b --mime-type "$f")"
            case "$mt" in
              application/zip)
                unzip -tq "$f" >/dev/null || { echo "::error::ZIP rusak/tidak lengkap: $(basename "$f")"; return 1; }
                rc=0; unzip -q -o "$f" -d "$out" || rc=$?
                # kode 1 = hanya peringatan (mis. path berbackslash), file tetap terekstrak
                [ "$rc" -le 1 ] ;;
              application/gzip|application/x-gzip|application/x-xz|application/x-bzip2|application/x-tar)
                tar -xf "$f" -C "$out" ;;
              application/x-7z-compressed|application/x-rar|application/vnd.rar)
                local z; z="$(ensure_7z)" || { echo "::error::7z tidak tersedia untuk $(basename "$f")"; return 1; }
                "$z" x -y -o"$out" "$f" >/dev/null ;;
              *) return 2 ;;
            esac
          }

          EXTRACTED=0
          if [ -n "$URL" ]; then
            echo "Sumber: link (diunduh ke folder sementara)"
            ok=0
            for percobaan in 1 2 3; do
              echo "=== Unduh, percobaan $percobaan ==="
              rm -rf "$DL"; mkdir -p "$DL"
              rc=0
              case "$URL" in
                *drive.google.com/drive/*folders/*|*drive.google.com/folderview*)
                  gdown --folder --remaining-ok "$URL" -O "$DL" || rc=$? ;;
                *drive.google.com/*|*drive.usercontent.google.com/*|*docs.google.com/*)
                  gdown --fuzzy "$URL" -O "$DL/" || rc=$? ;;
                http://*|https://*)
                  curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 \
                       -o "$DL/download.bin" "$URL" || rc=$? ;;
                *)
                  echo "::error::Link tidak dikenali. Gunakan link Google Drive atau URL http(s)."
                  exit 1 ;;
              esac
              if [ "$rc" -eq 0 ] && [ -n "$(find "$DL" -type f -print -quit)" ]; then
                ok=1; break
              fi
              sleep 20
            done
            if [ "$ok" != "1" ]; then
              echo "::error::Gagal mengunduh dari link setelah 3 percobaan. Pastikan akses 'Siapa saja yang memiliki link' dan kuota unduhan Drive belum habis (coba lagi beberapa jam kemudian atau buat salinan file di Drive Anda)."
              exit 1
            fi

            echo "Isi unduhan:"
            find "$DL" -type f -exec ls -l {} \;

            # Kalau hasil unduhan hanya 1 file dan isinya halaman web = Drive minta login/izin.
            if [ "$(find "$DL" -type f | wc -l)" -eq 1 ]; then
              only="$(find "$DL" -type f | sed -n '1p')"
              if [ "$(file -b --mime-type "$only")" = "text/html" ]; then
                echo "::error::Yang terunduh adalah halaman web, bukan file. Ubah akses file di Drive menjadi 'Siapa saja yang memiliki link', lalu jalankan ulang."
                exit 1
              fi
            fi

            # Ekstrak semua arsip yang ada (satu subfolder per arsip).
            n=0
            EXTRACTED=0
            while IFS= read -r -d '' f; do
              n=$((n+1))
              rc=0
              extract_one "$f" "$EX/arsip$n" || rc=$?
              if [ "$rc" -eq 0 ]; then
                EXTRACTED=$((EXTRACTED+1))
                echo "Terekstrak: $(basename "$f")"
              elif [ "$rc" -eq 2 ]; then
                rm -rf "$EX/arsip$n"
              else
                echo "::error::Gagal mengekstrak $(basename "$f")"
                exit 1
              fi
            done < <(find "$DL" -type f -print0)

            ROOT="$(find_root "$DL" "$EX")"
          else
            echo "Link kosong -> memakai isi repo ini sebagai source"
            ROOT="$(find_root "$GITHUB_WORKSPACE")"
          fi

          if [ -z "$ROOT" ]; then
            if [ -n "$URL" ] && [ "$EXTRACTED" -eq 0 ]; then
              echo "::error::Source Nova Engine tidak ditemukan: link berhasil diunduh, tetapi TIDAK ADA arsip (.zip/.tar/.7z/.rar) di dalamnya. Yang terunduh hanya file di bawah ini. Unggah Nova-engine.zip ke Drive (bukan file .yml), bagikan 'Siapa saja yang memiliki link', lalu tempel link FILE ZIP itu (atau folder yang berisi ZIP itu) pada isian Link Drive / URL."
              echo "Isi yang terunduh dari link:"
              find "$DL" -type f -exec ls -l {} \; 2>/dev/null || true
              if [ -n "$(find "$DL" -type f \( -name '*.yml' -o -name '*.yaml' \) -print -quit 2>/dev/null)" ]; then
                echo "CATATAN: yang terunduh adalah file workflow (.yml). Itu BUKAN source Nova Engine; folder/link Drive Anda belum berisi Nova-engine.zip."
              fi
            elif [ -n "$URL" ]; then
              echo "::error::Source Nova Engine tidak ditemukan: arsip sudah terekstrak, tetapi tidak ada folder yang punya SConstruct + version.py + platform/android/java/gradlew (isi folder godot-master). Struktur teratas isi arsip:"
              find "$EX" -maxdepth 3 -not -path '*/__MACOSX/*' 2>/dev/null | head -n 60 || true
            else
              echo "::error::Source Nova Engine tidak ditemukan: isian link kosong dan repo ini tidak berisi source (butuh SConstruct, version.py, platform/android/java/gradlew). Isi Link Drive / URL dengan link Nova-engine.zip. Struktur teratas repo:"
              find "$GITHUB_WORKSPACE" -maxdepth 2 -not -path '*/.git/*' 2>/dev/null | head -n 60 || true
            fi
            exit 1
          fi

          # Pindahkan ke lokasi tetap (kecuali sudah di workspace).
          if [ "$ROOT" != "$GITHUB_WORKSPACE" ]; then
            rm -rf "$GITHUB_WORKSPACE/nova-src"
            mv "$ROOT" "$GITHUB_WORKSPACE/nova-src"
            ROOT="$GITHUB_WORKSPACE/nova-src"
          fi
          rm -rf "$DL" "$EX"

          # Perbaikan otomatis hal yang sering rusak saat lewat Drive/Windows:
          # baris CRLF dan bit eksekusi pada gradlew.
          cd "$ROOT/platform/android/java"
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle/wrapper/gradle-wrapper.jar tidak ada di source (file .jar hilang saat zip/unggah)."
            exit 1
          fi

          echo "NOVA_SRC=$ROOT" >> "$GITHUB_ENV"
          echo "Source siap di: $ROOT"
          cat "$ROOT/version.py"
          df -h /

      # ---------------------------------------------------------------
      # Baca versi SDK/NDK langsung dari source supaya TIDAK PERNAH
      # beda dengan yang diminta SCons dan Gradle. Kalau gagal dibaca,
      # dipakai nilai cadangan di bagian env atas.
      # ---------------------------------------------------------------
      - name: Baca versi toolchain dari source
        id: versi
        env:
          INPUT_VERSION: ${{ inputs.app_version }}
        run: |
          cd "$NOVA_SRC"
          python3 - <<'PY'
          import os, re, pathlib, sys

          def read(path):
              f = pathlib.Path(path)
              return f.read_text(errors="ignore") if f.is_file() else ""

          def grab(text, pattern, flags=0):
              m = re.search(pattern, text, flags)
              return m.group(1) if m else None

          cfg = read("platform/android/java/app/config.gradle")
          det = read("platform/android/detect.py")
          edt = read("platform/android/java/editor/build.gradle")

          sdk = grab(cfg, r"compileSdk(?:Version)?\s*[:=]\s*(\d+)")
          tools = grab(cfg, r"buildTools(?:Version)?\s*[:=]\s*['\"]([\d.]+)['\"]")
          ndk_gradle = grab(cfg, r"ndkVersion\s*[:=]\s*['\"]([\d.]+)['\"]")
          ndk_scons = grab(det, r"def get_ndk_version\(\)[^\"']*[\"']([\d.]+)[\"']")
          src_version = grab(edt, r"def generateVersionName\(\)\s*\{.*?return\s+[\"']([\w.\-]+)[\"']", re.S)

          platform = f"android-{sdk}" if sdk else os.environ["ANDROID_PLATFORM"]
          build_tools = tools or os.environ["ANDROID_BUILD_TOOLS"]
          ndk = ndk_scons or ndk_gradle or os.environ["ANDROID_NDK"]
          ndk_list = []
          for v in (ndk_scons, ndk_gradle):
              if v and v not in ndk_list:
                  ndk_list.append(v)
          if not ndk_list:
              ndk_list = [os.environ["ANDROID_NDK"]]

          for label, val in (("compileSdk", sdk), ("buildTools", tools), ("ndk(config.gradle)", ndk_gradle), ("ndk(detect.py)", ndk_scons)):
              if not val:
                  print(f"::warning::{label} tidak terbaca dari source, memakai nilai cadangan.")
          if ndk_scons and ndk_gradle and ndk_scons != ndk_gradle:
              print(f"::warning::Versi NDK berbeda: detect.py={ndk_scons}, config.gradle={ndk_gradle}. Keduanya akan dipasang.")

          # Versi untuk nama file: input > source (generateVersionName) > "custom".
          want = os.environ.get("INPUT_VERSION", "").strip()
          app_version = want or src_version or "custom"
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,32}", app_version):
              print(f"::error::Versi '{app_version}' tidak valid. Pakai huruf, angka, titik, minus, underscore (maks 32).")
              sys.exit(1)

          print(f"Platform   : {platform}")
          print(f"Build tools: {build_tools}")
          print(f"NDK utama  : {ndk}")
          print(f"NDK dipasang: {' '.join(ndk_list)}")
          print(f"Versi APP  : {app_version} (dari {'input' if want else 'source' if src_version else 'cadangan'})")

          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write(f"NOVA_PLATFORM={platform}\n")
              out.write(f"NOVA_BUILD_TOOLS={build_tools}\n")
              out.write(f"NOVA_NDK={ndk}\n")
              out.write(f"NOVA_NDK_LIST={' '.join(ndk_list)}\n")
              out.write(f"APP_VERSION={app_version}\n")
          PY

      # ---------------------------------------------------------------
      # Pasang Android SDK / NDK.
      # Image runner bisa saja TIDAK menaruh sdkmanager di PATH (itu
      # penyebab error "sdkmanager: command not found"). Jadi:
      #   1) cari sdkmanager di lokasi umum,
      #   2) kalau tidak ada, unduh Android command-line tools resmi
      #      dari Google dan pasang di $ANDROID_HOME/cmdline-tools/latest
      #      (lokasi yang juga dicari SCons Godot).
      # ---------------------------------------------------------------
      - name: Install Android SDK / NDK
        id: sdk
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK"
          sudo mkdir -p "$SDK"

          # Pastikan folder SDK bisa ditulis user runner (sdkmanager menulis ke sini).
          need_chown=0
          for d in "$SDK" "$SDK/licenses" "$SDK/platforms" "$SDK/build-tools" \
                   "$SDK/ndk" "$SDK/cmdline-tools" "$SDK/platform-tools"; do
            if [ -e "$d" ] && [ ! -w "$d" ]; then need_chown=1; fi
          done
          if [ "$need_chown" = "1" ]; then
            echo "Memperbaiki izin tulis folder SDK"
            sudo chown -R "$(id -u):$(id -g)" "$SDK"
          fi

          find_sdkmanager() {
            local c
            if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
              echo "$SDK/cmdline-tools/latest/bin/sdkmanager"; return 0
            fi
            for c in "$SDK"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$c" ]; then echo "$c"; return 0; fi
            done
            if command -v sdkmanager >/dev/null 2>&1; then
              command -v sdkmanager; return 0
            fi
            return 1
          }

          install_cmdline_tools() {
            local tmp="$RUNNER_TEMP/cmdline-tools-dl" url f
            for url in \
              https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip; do
              rm -rf "$tmp"; mkdir -p "$tmp/x"
              f="$tmp/cmdline-tools.zip"
              echo "Unduh: $url"
              if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o "$f" "$url" \
                 && unzip -tq "$f" >/dev/null 2>&1; then
                unzip -q "$f" -d "$tmp/x"
                mkdir -p "$SDK/cmdline-tools"
                rm -rf "$SDK/cmdline-tools/latest"
                mv "$tmp/x/cmdline-tools" "$SDK/cmdline-tools/latest"
                rm -rf "$tmp"
                return 0
              fi
            done
            return 1
          }

          SDKM="$(find_sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            echo "sdkmanager tidak ada di image runner -> mengunduh command-line tools dari Google"
            install_cmdline_tools || { echo "::error::Gagal mengunduh Android command-line tools dari dl.google.com."; exit 1; }
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          chmod +x "$SDKM" || true
          if [ ! -x "$SDKM" ]; then
            echo "::error::sdkmanager tidak bisa dijalankan: $SDKM"
            exit 1
          fi
          echo "sdkmanager: $SDKM"

          # SCons Godot mencari $SDK/cmdline-tools/latest/bin/sdkmanager; buat symlink bila perlu.
          case "$SDKM" in
            "$SDK"/cmdline-tools/*/bin/sdkmanager)
              ver_dir="${SDKM#"$SDK"/cmdline-tools/}"
              ver_dir="${ver_dir%%/*}"
              if [ "$ver_dir" != "latest" ] && [ ! -e "$SDK/cmdline-tools/latest" ]; then
                ln -s "$ver_dir" "$SDK/cmdline-tools/latest"
              fi ;;
          esac

          java -version 2>&1 | head -n 1 || true
          { yes || true; } 2>/dev/null | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true

          pkgs=("platform-tools" "platforms;${NOVA_PLATFORM}" "build-tools;${NOVA_BUILD_TOOLS}")
          for v in $NOVA_NDK_LIST; do
            pkgs+=("ndk;$v")
          done

          ok=0
          for percobaan in 1 2 3; do
            echo "=== sdkmanager, percobaan $percobaan ==="
            if { yes || true; } 2>/dev/null | "$SDKM" --sdk_root="$SDK" "${pkgs[@]}"; then
              ok=1
              break
            fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::sdkmanager gagal memasang: ${pkgs[*]}"
            exit 1
          fi

          dirs=("platform-tools" "platforms/${NOVA_PLATFORM}" "build-tools/${NOVA_BUILD_TOOLS}")
          for v in $NOVA_NDK_LIST; do
            dirs+=("ndk/$v")
          done
          for d in "${dirs[@]}"; do
            if [ ! -d "$SDK/$d" ]; then
              echo "::error::Komponen SDK '$d' gagal terpasang."
              exit 1
            fi
          done

          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_ROOT=$SDK/ndk/${NOVA_NDK}"
            echo "ANDROID_NDK_HOME=$SDK/ndk/${NOVA_NDK}"
          } >> "$GITHUB_ENV"
          dirname "$SDKM" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Siapkan keystore
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS_FILE="$RUNNER_TEMP/dtp-release.keystore"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "Memakai keystore dari secrets"
            echo "$KS_B64" | base64 -d > "$KS_FILE"
            PASS="$KS_PASS"
            ALIAS="$KS_ALIAS"
          else
            echo "Secrets kosong -> membuat keystore sementara"
            PASS="dtpnova2026"
            ALIAS="dtp"
            keytool -genkeypair -keystore "$KS_FILE" -alias "$ALIAS" \
              -storepass "$PASS" -keypass "$PASS" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=DTP Studio, O=DTP, C=ID"
          fi
          test -s "$KS_FILE"
          echo "GODOT_ANDROID_SIGN_KEYSTORE=$KS_FILE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_SIGN_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Compile Nova Engine editor (SCons)
        id: scons
        run: |
          cd "$NOVA_SRC"
          mkdir -p "$GITHUB_WORKSPACE/logs"
          ok=0
          for percobaan in 1 2 3; do
            echo "=== Kompilasi, percobaan $percobaan ==="
            # store_release=yes WAJIB: tanpa ini, target=editor menaruh .so di
            # lib/libs/tools/debug dan Gradle hanya membuat APK *debug*
            # (android_editor-android-debug.apk), bukan release.
            if scons platform=android target=editor arch=arm64 production=yes \
                 store_release=yes \
                 lto=none module_text_server_fb_enabled=yes accesskit=no \
                 swappy=no -j"$(nproc)" 2>&1 | tee -a "$GITHUB_WORKSPACE/logs/scons-full.log"; then
              ok=1
              break
            fi
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Kompilasi SCons gagal setelah 3 percobaan."
            exit 1
          fi
          ls -l bin/ || true
          df -h /

          # Pastikan .so masuk folder RELEASE (yang dicari task Gradle generateGodotEditor).
          LIBS="platform/android/java/lib/libs/tools"
          if [ ! -s "$LIBS/release/arm64-v8a/libgodot_android.so" ]; then
            echo "::error::libgodot_android.so tidak ada di $LIBS/release/arm64-v8a (store_release=yes tidak berlaku?)."
            ls -lR "$LIBS" || true
            exit 1
          fi
          ls -lh "$LIBS/release/arm64-v8a"

      - name: Generate APK (Gradle)
        id: gradle
        run: |
          cd "$NOVA_SRC/platform/android/java"
          mkdir -p "$GITHUB_WORKSPACE/logs"
          ok=0
          for percobaan in 1 2 3; do
            echo "=== Gradle, percobaan $percobaan ==="
            if ./gradlew generateGodotEditor --no-daemon --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/logs/gradle-full.log"; then
              ok=1
              break
            fi
            sleep 30
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Gradle gagal setelah 3 percobaan."
            exit 1
          fi

      # ---------------------------------------------------------------
      # Cari APK, pastikan isinya memuat library native arm64 dan
      # benar-benar bertanda tangan (kalau tidak, APK tidak bisa dipasang
      # dan build dianggap gagal), lalu ganti nama.
      # ---------------------------------------------------------------
      - name: Ganti nama dan verifikasi APK
        id: verif
        run: |
          cd "$NOVA_SRC"
          APK_SRC=""
          for pat in 'android_editor-android-release*.apk' 'android_editor*release*.apk' '*release*.apk'; do
            APK_SRC="$(find bin/android_editor_builds -name "$pat" ! -name '*unsigned*' 2>/dev/null | sort | sed -n '1p')"
            if [ -n "$APK_SRC" ]; then
              break
            fi
          done
          if [ -z "$APK_SRC" ]; then
            echo "::error::APK release tidak ditemukan. Isi bin/android_editor_builds:"
            ls -lR bin/android_editor_builds || true
            exit 1
          fi
          echo "APK sumber: $APK_SRC"

          if ! unzip -l "$APK_SRC" | grep -q 'lib/arm64-v8a/.*\.so'; then
            echo "::error::APK tidak berisi library native arm64-v8a (hasil kompilasi tidak ikut terpaket)."
            unzip -l "$APK_SRC" | head -n 40
            exit 1
          fi
          if ! unzip -l "$APK_SRC" | grep -q 'AndroidManifest.xml'; then
            echo "::error::APK tidak berisi AndroidManifest.xml."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/hasil"
          APK_OUT="$GITHUB_WORKSPACE/hasil/DTP-Nova-Engine-${APP_VERSION}-arm64.apk"
          cp "$APK_SRC" "$APK_OUT"
          ls -lh "$GITHUB_WORKSPACE/hasil"
          echo "APK_OUT=$APK_OUT" >> "$GITHUB_ENV"

          BT="$ANDROID_HOME/build-tools/${NOVA_BUILD_TOOLS}"
          "$BT/aapt2" dump badging "$APK_OUT" 2>/dev/null \
            | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|native-code)" || true

          if ! "$BT/apksigner" verify --print-certs "$APK_OUT"; then
            echo "::error::APK tidak bertanda tangan valid, tidak bisa dipasang di HP."
            exit 1
          fi

          {
            echo "### Nova Engine ${APP_VERSION} (arm64)"
            echo ""
            echo "- Berkas: \`$(basename "$APK_OUT")\`"
            echo "- Ukuran: $(du -h "$APK_OUT" | cut -f1)"
            echo "- SHA-256: \`$(sha256sum "$APK_OUT" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK (artifact)
        id: upload_apk
        uses: actions/upload-artifact@v6
        with:
          name: DTP-Nova-Engine-${{ env.APP_VERSION }}-apk
          path: hasil/DTP-Nova-Engine-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Buat GitHub Release
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nova-v${APP_VERSION}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK_OUT" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nova Engine ${APP_VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK editor Nova Engine arm64. Commit workflow: ${GITHUB_SHA}"

      # ---------------------------------------------------------------
      # LAPORAN ERROR LENGKAP — hanya jalan kalau build gagal / dibatalkan.
      # Semua langkah di bawah memakai `shell: bash` biasa (bukan nova-sh)
      # supaya tetap jalan walau pembungkus bermasalah.
      # ---------------------------------------------------------------
      - name: Kumpulkan log kegagalan
        id: kumpul
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/logs"
          cd "$GITHUB_WORKSPACE"

          # 1) Ekor log kompilasi (perilaku lama, tetap ada)
          for f in logs/scons-full.log logs/gradle-full.log; do
            if [ -f "$f" ]; then
              tail -n 3000 "$f" > "${f%-full.log}-akhir.log"
            fi
          done
          if [ -n "${NOVA_SRC:-}" ] && [ -f "$NOVA_SRC/config.log" ]; then
            cp "$NOVA_SRC/config.log" logs/
          fi
          if [ -n "${NOVA_SRC:-}" ] && [ -d "$NOVA_SRC/platform/android/java" ]; then
            (cd "$NOVA_SRC/platform/android/java" \
              && find . -path '*/build/reports/*' -type f -print0 \
              | tar --null -czf "$GITHUB_WORKSPACE/logs/gradle-reports.tgz" -T -)
          fi
          rm -f logs/scons-full.log logs/gradle-full.log

          # 2) Lingkungan runner & versi alat
          {
            echo "Waktu (UTC)   : $(date -u)"
            echo "uname         : $(uname -a)"
            echo "OS            : $( (lsb_release -ds 2>/dev/null) || head -n 2 /etc/os-release | tr '\n' ' ')"
            echo "CPU core      : $(nproc)"
            echo "Uptime/beban  : $(uptime)"
            echo "--- Memori (free -m) ---"; free -m
            echo "--- Disk (df -h) ---"; df -h 2>/dev/null | grep -vE 'tmpfs|udev|overlay' 
            echo "--- Versi alat ---"
            echo "java          : $(java -version 2>&1 | head -n 1)   JAVA_HOME=${JAVA_HOME:-}"
            echo "python        : $(python3 --version 2>&1)"
            echo "scons         : $(scons --version 2>&1 | sed -n '2,3p' | tr '\n' ' ')"
            echo "gdown         : $(python3 -m pip show gdown 2>/dev/null | sed -n '2p')"
            echo "gh            : $(gh --version 2>&1 | head -n 1)"
            echo "clang NDK     : $(ls -d "${ANDROID_NDK_ROOT:-/nonexistent}"/toolchains/llvm/prebuilt/*/bin/clang 2>/dev/null | head -n 1)"
            if [ -n "${NOVA_SRC:-}" ]; then
              echo "--- Source ---"
              echo "NOVA_SRC      : $NOVA_SRC"
              echo "version.py    : $(tr '\n' ' ' < "$NOVA_SRC/version.py" 2>/dev/null | head -c 300)"
              echo "gradle wrapper: $(grep distributionUrl "$NOVA_SRC/platform/android/java/gradle/wrapper/gradle-wrapper.properties" 2>/dev/null)"
              echo "gradle jvmargs: $(grep -h 'org.gradle.jvmargs' "$NOVA_SRC/platform/android/java/gradle.properties" 2>/dev/null)"
              echo "config.gradle : $(grep -hE "compileSdk|buildTools|ndkVersion|androidGradlePlugin|kotlinVersion" "$NOVA_SRC/platform/android/java/app/config.gradle" 2>/dev/null | tr -s ' ' | tr '\n' ';')"
              echo "detect.py NDK : $(grep -hA3 'def get_ndk_version' "$NOVA_SRC/platform/android/detect.py" 2>/dev/null | tr -s ' ' | tr '\n' ' ')"
            fi
            echo "--- Android SDK ---"
            echo "ANDROID_HOME  : ${ANDROID_HOME:-}"
            for d in platforms build-tools ndk cmdline-tools; do
              echo "$d: $(ls "${ANDROID_HOME:-/nonexistent}/$d" 2>/dev/null | tr '\n' ' ')"
            done
            SDKM="${ANDROID_HOME:-/nonexistent}/cmdline-tools/latest/bin/sdkmanager"
            if [ -x "$SDKM" ]; then
              echo "--- sdkmanager --list_installed ---"
              timeout 90 "$SDKM" --sdk_root="$ANDROID_HOME" --list_installed 2>&1 | head -n 40
            fi
            echo "--- Variabel NOVA/ANDROID/ringkas (tanpa rahasia) ---"
            env | grep -E '^(NOVA_|ANDROID_|APP_VERSION=|JAVA_HOME=|GODOT_ANDROID_SIGN_KEYSTORE=|GODOT_ANDROID_KEYSTORE_ALIAS=|SCONS|GRADLE_|ImageOS=|ImageVersion=)' | sort
          } > logs/lingkungan.txt 2>&1

          # 3) Keluaran build: apa saja yang sempat terbentuk
          {
            if [ -n "${NOVA_SRC:-}" ] && [ -d "$NOVA_SRC" ]; then
              echo "--- $NOVA_SRC/bin ---"
              ls -la "$NOVA_SRC/bin" 2>&1 | head -n 60
              echo "--- Library .so di bin/ dan platform/android/java (ukuran byte, path) ---"
              find "$NOVA_SRC/bin" "$NOVA_SRC/platform/android/java" -name '*.so' -type f \
                -not -path '*/node_modules/*' -printf '%s  %p\n' 2>/dev/null | head -n 60
              echo "--- bin/android_editor_builds ---"
              ls -lR "$NOVA_SRC/bin/android_editor_builds" 2>&1 | head -n 60
              echo "--- hasil Gradle (build/outputs) ---"
              find "$NOVA_SRC/platform/android/java" -path '*/build/outputs/*' -type f -printf '%s  %p\n' 2>/dev/null | head -n 40
              echo "--- folder lib/libs (tempat Gradle mencari .so hasil SCons) ---"
              find "$NOVA_SRC/platform/android/java/lib/libs" -maxdepth 5 2>/dev/null | head -n 40
            else
              echo "(NOVA_SRC belum terbentuk — kegagalan terjadi sebelum source siap)"
            fi
            echo "--- hasil/ (APK yang sudah diganti nama) ---"
            ls -la "$GITHUB_WORKSPACE/hasil" 2>&1 | head -n 20
          } > logs/keluaran-build.txt 2>&1

          # 4) Diagnostik tambahan: bukti OOM, log daemon Gradle, crash JVM, proses terbesar
          {
            echo "--- dmesg: jejak OOM / proses dibunuh kernel ---"
            sudo dmesg 2>/dev/null | grep -iE 'out of memory|killed process|oom-kill|oom_reaper' | tail -n 20
            echo "(selesai; kosong = tidak ada jejak OOM)"
            echo "--- Proses pemakai memori terbesar saat ini ---"
            ps aux --sort=-%mem 2>/dev/null | head -n 8 | cut -c1-220
            echo "--- Log daemon Gradle terbaru (200 baris akhir) ---"
            LASTD="$(ls -t "$HOME"/.gradle/daemon/*/daemon-*.out.log 2>/dev/null | head -n 1)"
            if [ -n "$LASTD" ]; then echo "$LASTD"; tail -n 200 "$LASTD"; else echo "(tidak ada)"; fi
            echo "--- Crash JVM (hs_err_pid*.log) ---"
            for h in $(find "$GITHUB_WORKSPACE" "$HOME" -maxdepth 6 -name 'hs_err_pid*.log' 2>/dev/null | head -n 3); do
              echo "$h"; head -n 60 "$h"
            done
          } > logs/diagnostik-tambahan.txt 2>&1

          ls -l logs || true

      - name: Buat laporan error lengkap (.txt)
        id: laporan
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          INPUT_DRIVE_URL: ${{ inputs.drive_url }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/logs"
          cd "$GITHUB_WORKSPACE"
          # Ambil data job (nama langkah, durasi, link) dari API GitHub — opsional.
          if [ -n "${GH_TOKEN:-}" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT:-1}/jobs" \
              > "$RUNNER_TEMP/nova-jobs-api.json" 2> "$RUNNER_TEMP/nova-jobs-api.err" \
              || { echo "(API job tidak tersedia: $(head -c 200 "$RUNNER_TEMP/nova-jobs-api.err"))"; rm -f "$RUNNER_TEMP/nova-jobs-api.json"; }
          fi
          python3 - <<'PY'
          # -*- coding: utf-8 -*-
          # Generator LAPORAN ERROR LENGKAP untuk workflow Build Nova Engine APK.
          # Dijalankan otomatis hanya saat build GAGAL. Tidak butuh paket tambahan.
          import os, re, sys, json, glob, datetime, collections

          ENV = os.environ.get
          WS = ENV("GITHUB_WORKSPACE") or os.getcwd()
          LOGS = os.path.join(WS, "logs")
          TMP = ENV("RUNNER_TEMP") or "/tmp"
          STEPDIR = os.path.join(TMP, "nova-steplogs")
          SRC = ENV("NOVA_SRC") or ""
          RUN_NO = ENV("GITHUB_RUN_NUMBER", "0")
          ATT = ENV("GITHUB_RUN_ATTEMPT", "1")
          RUN_TAG = RUN_NO if ATT in ("", "1") else "%s-a%s" % (RUN_NO, ATT)
          os.makedirs(os.path.join(LOGS, "langkah"), exist_ok=True)

          # id langkah -> (nama, nomor tahap, jenis)
          STEPS = [
              ("disk", "Lapangkan ruang disk", 1, "script"),
              ("checkout", "Checkout", 1, "action"),
              ("java", "Set up Java 17", 1, "action"),
              ("python", "Set up Python", 1, "action"),
              ("pip", "Install SCons dan gdown", 1, "script"),
              ("source", "Ambil dan ekstrak source", 2, "script"),
              ("versi", "Baca versi toolchain dari source", 3, "script"),
              ("sdk", "Install Android SDK / NDK", 4, "script"),
              ("keystore", "Siapkan keystore", 5, "script"),
              ("scons", "Compile Nova Engine editor (SCons)", 6, "script"),
              ("gradle", "Generate APK (Gradle)", 7, "script"),
              ("verif", "Ganti nama dan verifikasi APK", 8, "script"),
              ("upload_apk", "Upload APK (artifact)", 9, "action"),
              ("release", "Buat GitHub Release", 9, "script"),
          ]
          TAHAP = {
              1: "Persiapan runner (disk, Java, Python, SCons)",
              2: "Ambil & ekstrak source",
              3: "Baca versi toolchain",
              4: "Pasang Android SDK / NDK",
              5: "Siapkan keystore (tanda tangan)",
              6: "Kompilasi C++ engine (SCons)",
              7: "Paket APK (Gradle)",
              8: "Verifikasi APK",
              9: "Upload APK & rilis",
          }
          STEP_INFO = {
              "disk": ("Membersihkan ruang disk runner sebelum build besar.",
                       "Hampir tidak pernah gagal; kalau gagal biasanya runner bermasalah."),
              "checkout": ("Mengambil isi repo GitHub ini ke runner.",
                           "Token/izin repo bermasalah atau GitHub sedang gangguan."),
              "java": ("Memasang JDK 17 (Temurin).", "Server unduhan JDK gangguan sementara."),
              "python": ("Memasang Python 3.12.", "Server unduhan Python gangguan sementara."),
              "pip": ("Memasang SCons, zstandard, gdown lewat pip.",
                      "PyPI gangguan/jaringan putus, atau versi paket tidak cocok."),
              "source": ("Mengunduh source dari link Drive/URL, mengekstrak, mencari root source Godot.",
                         "Link Drive tidak publik/kuota habis, ZIP rusak, struktur folder salah, gradle-wrapper.jar hilang."),
              "versi": ("Membaca versi compileSdk/buildTools/NDK dari file source.",
                        "File config.gradle/detect.py berubah format, atau input versi tidak valid."),
              "sdk": ("Memasang Android SDK, build-tools, platform, dan NDK lewat sdkmanager.",
                      "Jaringan ke dl.google.com, lisensi belum disetujui, versi NDK/platform tidak ada, izin folder SDK."),
              "keystore": ("Menyiapkan keystore penanda tangan APK (dari secrets atau sementara).",
                           "Secret ANDROID_KEYSTORE_* salah/rusak (base64 tidak valid, password salah)."),
              "scons": ("Mengompilasi engine C++ untuk Android arm64 (langkah paling lama, ±jam).",
                        "Error kode C++ di source, NDK tidak cocok, disk/RAM habis, modul/SCsub rusak."),
              "gradle": ("Membungkus hasil kompilasi menjadi APK editor memakai Gradle.",
                         "Dependensi tidak terunduh, versi Java/AGP tidak cocok, library .so hasil SCons tidak ditemukan, RAM Gradle habis, error Kotlin/Java."),
              "verif": ("Mencari APK, cek isi arm64 + tanda tangan (apksigner).",
                        "APK tidak terbentuk, tidak ada lib arm64-v8a, atau tanda tangan tidak valid."),
              "upload_apk": ("Mengunggah APK sebagai artifact.", "Path APK salah atau kuota artifact penuh."),
              "release": ("Membuat GitHub Release (tidak fatal).", "Tag sudah ada atau izin contents:write kurang."),
          }

          WIB = datetime.timezone(datetime.timedelta(hours=7))
          NOW = datetime.datetime.now(datetime.timezone.utc)

          ANSI = re.compile(r"\x1b\[[0-9;?]*[ -/]*[@-~]")


          def strip_ansi(s):
              return ANSI.sub("", s)


          def short(s, n=600):
              s = s.rstrip("\n")
              return s if len(s) <= n else s[:n] + " …[dipotong %d karakter]" % (len(s) - n)


          # ------------------------------------------------------------------ redaksi
          _SECRETS = []
          for k in ("GODOT_ANDROID_SIGN_PASSWORD", "KS_PASS_SECRET", "GH_TOKEN"):
              v = ENV(k)
              if v and len(v) >= 4:
                  _SECRETS.append(v)
          _TOKEN_RE = re.compile(r"(ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_\-]{30,})")
          _DRIVE_RE = re.compile(r"((?:[?&]id=|/d/|/folders/)[A-Za-z0-9_\-]{5})[A-Za-z0-9_\-]{10,}")


          def redact(t):
              for s in _SECRETS:
                  t = t.replace(s, "***")
              t = _TOKEN_RE.sub("***", t)
              t = _DRIVE_RE.sub(r"\1***", t)
              return t


          # ------------------------------------------------------------------ baca log
          def read_file(path):
              try:
                  with open(path, "r", errors="replace") as f:
                      return f.read()
              except Exception:
                  return ""


          def to_lines(text):
              text = text.replace("\r\n", "\n").replace("\r", "\n")
              return [strip_ansi(x) for x in text.split("\n")]


          def load_steplogs():
              out = {}
              for p in sorted(glob.glob(os.path.join(STEPDIR, "*.log"))):
                  sid = os.path.basename(p)[:-4]
                  raw = read_file(p)
                  lines = to_lines(raw)
                  meta = {"exit": None, "mulai": None, "selesai": None}
                  for l in lines:
                      if l.startswith("##[nova]"):
                          m = re.search(r"mulai=(\S+)", l)
                          if m and not meta["mulai"]:
                              meta["mulai"] = m.group(1)
                          m = re.search(r"selesai=(\S+) exit=(\d+)", l)
                          if m:
                              meta["selesai"], meta["exit"] = m.group(1), int(m.group(2))
                  out[sid] = {"lines": lines, "meta": meta}
              return out


          # ------------------------------------------------------------------ deteksi error
          STRONG = [
              ("workflow", re.compile(r"^::error")),
              ("scons", re.compile(r"^scons: \*\*\*|^scons: building terminated")),
              ("kompiler", re.compile(r"^\S[^\s:]*:\d+(?::\d+)?: (?:fatal )?error:")),
              ("kompiler", re.compile(r"\b(?:clang|clang\+\+|gcc|g\+\+|cc1plus|c\+\+): (?:fatal )?error:")),
              ("kompiler", re.compile(r"internal compiler error|signal terminated program")),
              ("linker", re.compile(r"undefined reference to|ld(?:\.lld)?: error:|collect2: error|ld returned \d+ exit status")),
              ("kotlin", re.compile(r"^e: \S+")),
              ("gradle", re.compile(r"^FAILURE: Build failed|^BUILD FAILED|^\* What went wrong:|Execution failed for task|^> Task \S+ FAILED")),
