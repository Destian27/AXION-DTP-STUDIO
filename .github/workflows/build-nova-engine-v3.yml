          def diagnose(lines_by_step, focus):
              """Cocokkan pola ke log. focus = id langkah gagal (None = semua)."""
              hits = {}
              ids = [focus] if focus and focus in lines_by_step else list(lines_by_step)
              for sid in ids:
                  lines = lines_by_step[sid]["lines"]
                  for kid, kat, pri, judul, rx, art, why, fix in KB_C:
                      for i, l in enumerate(lines):
                          if not l or l.startswith(("##[nova]",) + NOISE):
                              continue
                          if rx.search(l):
                              h = hits.setdefault(kid, {"kat": kat, "pri": pri, "judul": judul, "art": art,
                                                        "why": why, "fix": fix, "ev": [], "n": 0, "step": sid})
                              h["n"] += 1
                              if len(h["ev"]) < 4:
                                  h["ev"].append((sid, i + 1, l))
              return sorted(hits.values(), key=lambda h: (h["pri"], h["ev"][0][1]))


          # ------------------------------------------------------------------ lokasi di source
          LOC_RX = [
              re.compile(r"((?:[A-Za-z]:)?[^\s:()'\"<>]+\.(?:cpp|cc|cxx|c|h|hpp|inc|mm|m|java|kt|kts|gradle|py|glsl|xml|properties))[:(](\d+)"),
              re.compile(r"(?:Build file|Script) '([^']+)' line: (\d+)"),
              re.compile(r"File \"([^\"]+)\", line (\d+)"),
              re.compile(r"(SConstruct|SCsub|[\w/.\-]*SCsub)[:(](\d+)"),
          ]
          _index = {}


          def build_index():
              if _index or not SRC or not os.path.isdir(SRC):
                  return
              for root, dirs, files in os.walk(SRC):
                  dirs[:] = [d for d in dirs if d not in (".git", "bin", ".gradle", "node_modules", "thirdparty")]
                  for f in files:
                      _index.setdefault(f, []).append(os.path.join(root, f))


          def resolve(p):
              if not SRC:
                  return None
              p = p.strip()
              cands = [p]
              if "nova-src/" in p:
                  cands.append(os.path.join(SRC, p.split("nova-src/", 1)[1]))
              cands.append(os.path.join(SRC, p))
              for c in cands:
                  if os.path.isfile(c):
                      return c
              build_index()
              arr = _index.get(os.path.basename(p), [])
              if len(arr) == 1:
                  return arr[0]
              tail = p.replace("\\", "/").lstrip("./")
              for a in arr:
                  if a.replace("\\", "/").endswith(tail):
                      return a
              return None


          def snippet(path, ln, ctx=6):
              try:
                  with open(path, "r", errors="replace") as f:
                      src = f.read().split("\n")
              except Exception:
                  return None
              a, b = max(0, ln - 1 - ctx), min(len(src), ln + ctx)
              out = []
              for k in range(a, b):
                  mark = ">>" if k + 1 == ln else "  "
                  out.append("%s %5d | %s" % (mark, k + 1, short(src[k], 220)))
              return out


          def find_locations(err_lines, limit=15):
              seen, res = set(), []
              for (_, _, l) in err_lines:
                  for rx in LOC_RX:
                      for m in rx.finditer(l):
                          p, ln = m.group(1), int(m.group(2))
                          key = (os.path.basename(p), ln)
                          if key in seen:
                              continue
                          seen.add(key)
                          res.append((p, ln, l))
                          if len(res) >= limit * 3:
                              return res
              return res


          # ------------------------------------------------------------------ pembantu laporan
          def fmt_dt(iso):
              try:
                  d = datetime.datetime.fromisoformat(iso.replace("Z", "+00:00"))
                  return d.strftime("%H:%M:%S")
              except Exception:
                  return iso or "-"


          def dur(a, b):
              try:
                  da = datetime.datetime.fromisoformat(a.replace("Z", "+00:00"))
                  db = datetime.datetime.fromisoformat(b.replace("Z", "+00:00"))
                  s = int((db - da).total_seconds())
                  return "%d mnt %d dtk" % (s // 60, s % 60) if s >= 60 else "%d dtk" % s
              except Exception:
                  return "-"


          def box(title, ch="="):
              return ["", ch * 78, title, ch * 78]


          def sub(title):
              return ["", "-- " + title + " " + "-" * max(2, 74 - len(title))]


          def indent(lines, pre="    "):
              return [pre + x for x in lines]


          def numbered(lines, start=1, w=6):
              return ["%*d | %s" % (w, start + i, short(l, 400)) for i, l in enumerate(lines)]


          def main():
              steplogs = load_steplogs()
              try:
                  outcomes = json.loads(ENV("STEPS_JSON") or "{}")
              except Exception:
                  outcomes = {}
              job_status = ENV("JOB_STATUS") or "failure"

              # --- data job dari API (opsional)
              api = {}
              try:
                  api = json.loads(read_file(os.path.join(TMP, "nova-jobs-api.json")) or "{}")
              except Exception:
                  api = {}
              job = (api.get("jobs") or [None])[0] if isinstance(api, dict) else None
              api_steps = {s.get("name"): s for s in (job or {}).get("steps", [])}
              job_url = (job or {}).get("html_url") or ""

              # --- status tiap langkah
              rows, failed = [], None
              for sid, name, tahap, jenis in STEPS:
                  o = outcomes.get(sid) or {}
                  concl = o.get("conclusion") or o.get("outcome") or "-"
                  outc = o.get("outcome") or "-"
                  a = api_steps.get(name) or {}
                  rows.append({"id": sid, "name": name, "tahap": tahap, "jenis": jenis, "concl": concl, "outc": outc,
                               "dur": dur(a.get("started_at", ""), a.get("completed_at", "")) if a else "-",
                               "num": a.get("number")})
                  if failed is None and concl == "failure":
                      failed = rows[-1]
              if failed is None:
                  for r in rows:
                      if r["outc"] == "cancelled":
                          failed = r
                          break
              if failed is None:
                  # tidak ada outcome terbaca -> tebak dari log: langkah terakhir yg exit != 0
                  for sid, name, tahap, jenis in STEPS:
                      m = (steplogs.get(sid) or {}).get("meta", {})
                      if m.get("exit") not in (None, 0):
                          failed = next(r for r in rows if r["id"] == sid)
                          break
              fid = failed["id"] if failed else None
              cancelled = (job_status == "cancelled") or (failed and failed["outc"] == "cancelled")

              # --- analisis log langkah gagal
              flines = steplogs.get(fid, {}).get("lines", []) if fid else []
              attempts = split_attempts(flines) if flines else []
              all_err = find_errors(flines) if flines else []
              # error per percobaan
              att_info = []
              for num, nm, a, b in attempts:
                  errs = find_errors(flines, a, b)
                  att_info.append({"num": num, "nm": nm, "a": a, "b": b, "errs": errs,
                                   "sig": norm_sig(errs[0][2]) if errs else ""})
              first_att = att_info[0] if att_info else None
              last_att = att_info[-1] if att_info else None
              # akar masalah = kegagalan PERTAMA (percobaan berikutnya hanya mengulang)
              last_errs = first_att["errs"] if first_att and first_att["errs"] else all_err
              lo = first_att["a"] if first_att else 0
              hi = first_att["b"] if first_att else len(flines)
              wrong, caused, tasks = gradle_blocks(flines[lo:hi]) if flines else ([], [], [])
              wrong = [(ln + lo, b) for ln, b in wrong]
              caused = [(ln + lo, t) for ln, t in caused]
              tasks = [(ln + lo, t) for ln, t in tasks]
              diag = diagnose(steplogs, fid) if steplogs else []
              if not diag and fid:
                  diag = diagnose(steplogs, None)  # cari di semua langkah

              # --- komponen laporan
              L = []
              wib = NOW.astimezone(WIB).strftime("%Y-%m-%d %H:%M:%S WIB")
              utc = NOW.strftime("%Y-%m-%d %H:%M:%S UTC")
              repo = ENV("GITHUB_REPOSITORY", "-")
              server = ENV("GITHUB_SERVER_URL", "https://github.com")
              run_id = ENV("GITHUB_RUN_ID", "")
              run_url = "%s/%s/actions/runs/%s" % (server, repo, run_id) if run_id else "-"
              step_url = ""
              if job_url and failed and failed.get("num"):
                  step_url = "%s#step:%d:1" % (job_url, failed["num"])

              L += ["=" * 78,
                    "  LAPORAN ERROR LENGKAP — NOVA ENGINE APK (arm64)",
                    "=" * 78,
                    "Dibuat       : %s  (%s)" % (wib, utc),
                    "Workflow     : %s  — run #%s (percobaan ke-%s)" % (ENV("GITHUB_WORKFLOW", "-"), RUN_NO, ENV("GITHUB_RUN_ATTEMPT", "1")),
                    "Repo         : %s   cabang: %s" % (repo, ENV("GITHUB_REF_NAME", "-")),
                    "Commit       : %s" % ENV("GITHUB_SHA", "-"),
                    "Dipicu oleh  : %s  (%s)" % (ENV("GITHUB_ACTOR", "-"), ENV("GITHUB_EVENT_NAME", "-")),
                    "Runner       : %s %s — %s (image %s)" % (ENV("RUNNER_OS", "-"), ENV("RUNNER_ARCH", "-"), ENV("RUNNER_NAME", "-"), ENV("ImageVersion", "-")),
                    "Link run     : %s" % run_url]
              if step_url:
                  L.append("Link langkah  : %s" % step_url)
              drv = redact(ENV("INPUT_DRIVE_URL") or "")
              L.append("Input         : drive_url = %s | app_version = %s" % (drv if drv else "(kosong -> pakai repo)", ENV("INPUT_APP_VERSION") or "(kosong -> otomatis)"))
              L += ["", "TIPS: salin SEMUA isi file ini lalu tempel ke asisten AI (mis. Claude) dengan kalimat:",
                    "      \"Tolong analisis laporan error build Nova Engine ini, cari akar masalahnya dan beri perbaikan",
                    "       lengkap (file mana yang diubah dan isinya).\"",
                    "      Bagian 1 (RINGKASAN) sudah cukup untuk gambaran cepat; sisanya adalah bukti lengkap."]

              name_txt = "LAPORAN-ERROR-NOVA-ENGINE-run%s.txt" % RUN_TAG

              # ===== 1. ringkasan
              L += box("[1] RINGKASAN CEPAT — BACA INI DULU")
              status = "DIBATALKAN / TIMEOUT" if cancelled else "GAGAL"
              L.append("Status build        : %s" % status)
              if failed:
                  L.append("Langkah yang gagal  : %s%s  (id: %s)" % ("#%s  " % failed["num"] if failed.get("num") else "", failed["name"], failed["id"]))
                  L.append("Tahap pipeline      : %d dari 9 — %s" % (failed["tahap"], TAHAP[failed["tahap"]]))
                  bar = "".join("#" if i < failed["tahap"] - 1 else ("X" if i == failed["tahap"] - 1 else ".") for i in range(9))
                  L.append("Posisi              : [%s]  (# selesai, X gagal, . belum jalan)" % bar)
                  apa, umum = STEP_INFO.get(failed["id"], ("-", "-"))
                  L.append("Fungsi langkah ini  : %s" % apa)
                  L.append("Biasanya gagal krn  : %s" % umum)
                  m = steplogs.get(fid, {}).get("meta", {})
                  if m.get("exit") is not None:
                      L.append("Kode keluar         : %s" % m["exit"])
                  if failed["jenis"] == "action":
                      L.append("CATATAN: langkah ini adalah 'action' pihak ketiga, outputnya tidak ikut tersalin ke laporan.")
                      L.append("         Buka log langkahnya langsung di halaman run (link di atas).")
              else:
                  L.append("Langkah yang gagal  : tidak terdeteksi otomatis (lihat tabel [2] dan log mentah).")
              if att_info and len(att_info) > 1:
                  sigs = [a["sig"] for a in att_info if a["errs"]]
                  konsisten = len(set(sigs)) == 1 and len(sigs) == len(att_info)
                  L.append("Percobaan           : %d kali — error %s" % (len(att_info), "SAMA di semua percobaan (permanen, bukan gangguan sementara)" if konsisten else "BERBEDA/tidak konsisten antar percobaan (kemungkinan sementara, mis. jaringan)"))
              L.append("")
              if diag:
                  d = diag[0]
                  L.append(">>> DUGAAN PENYEBAB UTAMA : %s   [%s]" % (d["judul"], d["kat"]))
                  L.append(">>> Artinya              : %s" % d["art"])
                  L.append(">>> Bukti                : log langkah '%s' baris %d:" % (d["ev"][0][0], d["ev"][0][1]))
                  L.append("        " + short(redact(d["ev"][0][2]), 300))
                  L.append(">>> Perbaikan awal       : %s" % d["fix"][0])
              else:
                  L.append(">>> Tidak ada pola error yang dikenali otomatis. Gunakan bagian [4] ERROR UTAMA dan [7] untuk analisis manual.")
              first_err = last_errs[0] if last_errs else None
              if first_err:
                  L += ["", "Error PERTAMA pada log (biasanya akar masalah; sisanya turunan):",
                        "    baris %d [%s] %s" % (first_err[0] + 1, first_err[1], short(redact(first_err[2]), 400))]

              # ===== 2. tabel langkah
              L += box("[2] STATUS SETIAP LANGKAH")
              L.append("%-3s %-5s %-40s %-10s %s" % ("No", "Tahap", "Langkah", "Hasil", "Durasi"))
              sym = {"success": "OK", "failure": "GAGAL", "skipped": "dilewati", "cancelled": "dibatalkan", "-": "-"}
              for r in rows:
                  mark = " <== GAGAL DI SINI" if failed and r["id"] == failed["id"] else ""
                  hasil = sym.get(r["concl"], r["concl"])
                  if r["outc"] == "failure" and r["concl"] == "success":
                      hasil = "gagal*"
                  L.append("%-3s %-5s %-40s %-10s %s%s" % (r["num"] or "", r["tahap"], r["name"][:40], hasil, r["dur"], mark))
              L.append("(* = gagal tetapi tidak fatal / diabaikan oleh workflow)")

              # ===== 3. diagnosis
              L += box("[3] DIAGNOSIS OTOMATIS — KENAPA BISA ERROR & CARA MEMPERBAIKI")
              if not diag:
                  L.append("Tidak ada pola yang cocok dengan basis pengetahuan. Lihat bagian [4]-[8].")
              for n, d in enumerate(diag[:8], 1):
                  L += ["", "#%d  %s   [%s]   (%d baris cocok)" % (n, d["judul"], d["kat"], d["n"]),
                        "    APA ARTINYA : %s" % d["art"], "    KENAPA BISA :"]
                  L += ["      - " + x for x in d["why"]]
                  L.append("    CARA PERBAIKI:")
                  L += ["      %d. %s" % (k, x) for k, x in enumerate(d["fix"], 1)]
                  L.append("    BUKTI (log langkah, nomor baris):")
                  for (sid, ln, txt) in d["ev"][:3]:
                      L.append("      [%s:%d] %s" % (sid, ln, short(redact(txt), 260)))
              if len(diag) > 8:
                  L.append("")
                  L.append("(+%d dugaan lain bernilai rendah tidak ditampilkan)" % (len(diag) - 8))

              # ===== 4. error utama
              L += box("[4] ERROR UTAMA (potongan log yang paling relevan)")
              if wrong:
                  ln, blk = wrong[-1]
                  L += sub("Gradle: 'What went wrong' (log baris %d)" % ln)
                  L += indent([short(redact(x), 400) for x in blk if x.strip() or True])
              if tasks:
                  L += sub("Task Gradle yang gagal")
                  L += indent(["baris %d: %s" % t for t in tasks[-5:]])
              if caused:
                  L += sub("Rantai 'Caused by' (yang PALING BAWAH = penyebab terdalam)")
                  seen = set()
                  for ln, t in caused:
                      if t not in seen:
                          seen.add(t)
                          L.append("    baris %d: %s" % (ln, short(redact(t), 400)))
              if first_err and flines:
                  a = max(0, first_err[0] - 25)
                  b = min(len(flines), first_err[0] + 40)
                  L += sub("Konteks error pertama (baris %d-%d, penanda >>> = baris error)" % (a + 1, b))
                  for k in range(a, b):
                      L.append("%s%6d | %s" % (">>> " if k == first_err[0] else "    ", k + 1, short(redact(flines[k]), 400)))
              if not (wrong or caused or first_err):
                  L.append("(tidak ada blok error terdeteksi pada log langkah yang gagal)")

              # ===== 5. konsistensi percobaan
              if len(att_info) > 1:
                  L += box("[5] KONSISTENSI ANTAR PERCOBAAN")
                  for a in att_info:
                      L.append("Percobaan %d (%s): %d baris error. Error pertama:" % (a["num"], a["nm"], len(a["errs"])))
                      L.append("    " + (short(redact(a["errs"][0][2]), 300) if a["errs"] else "(tidak ada error terdeteksi)"))
                  sigs = [a["sig"] for a in att_info if a["errs"]]
                  if sigs and len(set(sigs)) == 1:
                      L += ["", "KESIMPULAN: error IDENTIK di semua percobaan -> masalah PERMANEN pada source/konfigurasi,",
                            "            bukan gangguan sementara. Mengulang tanpa mengubah apa pun tidak akan membantu."]
                  else:
                      L += ["", "KESIMPULAN: error berbeda antar percobaan -> kemungkinan masalah sementara (jaringan/server),",
                            "            atau ada efek samping dari percobaan sebelumnya. Coba jalankan ulang."]

              # ===== 6. lokasi di source
              L += box("[6] LOKASI ERROR DI SOURCE (file, baris, potongan kode)")
              locs = find_locations(last_errs[:200] + [(0, "", x) for x in sum((b for _, b in wrong), [])] + [(0, "", t) for _, t in caused[:30]])
              shown = 0
              unresolved = []
              for p, ln, srcline in locs:
                  rp = resolve(p)
                  if rp and shown < 15:
                      rel = os.path.relpath(rp, SRC) if SRC else rp
                      sn = snippet(rp, ln)
                      if sn:
                          shown += 1
                          L += ["", "FILE: %s   BARIS: %d" % (rel, ln), "  Pesan: " + short(redact(srcline.strip()), 300)]
                          L += indent(sn, "  ")
                          continue
                  unresolved.append((p, ln))
              if not shown:
                  L.append("Tidak ada referensi file:baris yang bisa dipetakan ke source (error bukan dari kode, atau file di luar source).")
              if unresolved:
                  L += sub("Referensi lokasi lain (file tidak ditemukan di source / di luar source)")
                  L += indent(["%s:%d" % (short(p, 160), ln) for p, ln in unresolved[:30]])

              # ===== 7. semua baris error unik
              L += box("[7] DAFTAR SEMUA BARIS ERROR (unik, berurutan; xN = jumlah kemunculan)")
              cnt = collections.OrderedDict()
              for (i, k, l) in all_err:
                  s = norm_sig(l)
                  if s in cnt:
                      cnt[s][2] += 1
                  else:
                      cnt[s] = [i + 1, l, 1, k]
              if not cnt:
                  L.append("(tidak ada)")
              for n, (s, (ln, l, c, k)) in enumerate(cnt.items()):
                  if n >= 120:
                      L.append("... (+%d baris error unik lain dipotong; lihat log mentah di folder langkah/)" % (len(cnt) - n))
                      break
                  L.append("%4d. baris %-7d [%-9s] x%-3d %s" % (n + 1, ln, k, c, short(redact(l), 330)))
              # peringatan workflow
              warn = []
              for sid, d in steplogs.items():
                  for i, l in enumerate(d["lines"]):
                      if l.startswith("::warning"):
                          warn.append((sid, i + 1, l))
              if warn:
                  L += sub("Peringatan (::warning::) dari workflow")
                  L += indent(["[%s:%d] %s" % (s, i, short(redact(l), 300)) for s, i, l in warn[:40]])

              # ===== 8. ekor log
              L += box("[8] EKOR LOG LANGKAH YANG GAGAL (200 baris terakhir)")
              if flines:
                  tail = [x for x in flines if x != ""][-200:]
                  L += indent([short(redact(x), 400) for x in tail], "  ")
              else:
                  L.append("(log langkah yang gagal tidak tersedia — lihat halaman run)")

              # ===== 9. lingkungan
              L += box("[9] LINGKUNGAN RUNNER & VERSI ALAT")
              L.append(redact(read_file(os.path.join(LOGS, "lingkungan.txt")).rstrip() or "(lingkungan.txt tidak tersedia)"))

              # ===== 10. keluaran build
              L += box("[10] KELUARAN BUILD (isi bin/, library .so, hasil Gradle)")
              L.append(redact(read_file(os.path.join(LOGS, "keluaran-build.txt")).rstrip() or "(keluaran-build.txt tidak tersedia)"))

              # ===== 11. diagnostik tambahan
              L += box("[11] DIAGNOSTIK TAMBAHAN (dmesg/OOM, log daemon Gradle, crash JVM)")
              L.append(redact(read_file(os.path.join(LOGS, "diagnostik-tambahan.txt")).rstrip() or "(tidak ada)"))

              # ===== 12. isi artifact
              L += box("[12] ISI ARTIFACT & CARA PAKAI")
              L += ["Artifact '%s' : file .txt ini saja (tidak di-zip)." % name_txt,
                    "Artifact 'nova-engine-log-gagal': laporan ini + langkah/*.log (log tiap langkah, disamarkan),",
                    "                                  scons-akhir.log, gradle-akhir.log, config.log, gradle-reports.tgz.",
                    "GitHub Release '[GAGAL] ...'     : file .txt ini bisa diunduh langsung dari tab Releases (HP).",
                    "Ringkasan juga tampil di halaman run (Summary) dalam kotak kode yang punya tombol Salin.",
                    "Rahasia (password keystore, token, ID Drive) sudah disamarkan menjadi ***.",
                    "", "=== AKHIR LAPORAN ==="]

              full = "\n".join(L) + "\n"
              full = redact(full)
              name = "LAPORAN-ERROR-NOVA-ENGINE-run%s.txt" % RUN_TAG
              with open(os.path.join(LOGS, name), "w") as f:
                  f.write(full)

              # salinan log per langkah (disamarkan, dipotong bila sangat panjang)
              for sid, d in steplogs.items():
                  ls = d["lines"]
                  pre = ""
                  if len(ls) > 6000:
                      pre = "### DIPOTONG: %d baris awal dibuang, mulai dari baris %d ###\n" % (len(ls) - 6000, len(ls) - 6000 + 1)
                      ls = ls[-6000:]
                  with open(os.path.join(LOGS, "langkah", sid + ".log"), "w") as f:
                      f.write(redact(pre + "\n".join(ls)))

              # ringkasan kompak (Summary + log)
              cut = full.find("[5] KONSISTENSI") if "[5] KONSISTENSI" in full else full.find("[6] LOKASI")
              end7 = full.find("[7] DAFTAR SEMUA")
              compact = full[:end7] if end7 > 0 else full[:60000]
              compact = compact[:120000]
              with open(os.path.join(LOGS, "RINGKASAN.txt"), "w") as f:
                  f.write(compact)

              # anotasi di halaman run
              def esc(s, prop=False):
                  s = s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  if prop:
                      s = s.replace(":", "%3A").replace(",", "%2C")
                  return s
              if diag:
                  d = diag[0]
                  msg = "%s | Langkah: %s | Perbaikan: %s | Detail lengkap: file LAPORAN-ERROR-*.txt (artifact/Release)." % (
                      d["art"], failed["name"] if failed else "?", d["fix"][0])
                  print("::error title=%s::%s" % (esc("Penyebab: " + d["judul"], True), esc(msg[:900])))
              elif first_err:
                  print("::error title=%s::%s" % (esc("Error pertama (tidak dikenali otomatis)", True), esc(short(redact(first_err[2]), 800))))
              print("Laporan dibuat: logs/%s (%d byte)" % (name, len(full.encode())))
              # tulis nama file untuk langkah berikutnya
              gh_env = ENV("GITHUB_ENV")
              if gh_env:
                  with open(gh_env, "a") as f:
                      f.write("LAPORAN_FILE=%s\n" % os.path.join(LOGS, name))
                      f.write("LAPORAN_NAME=%s\n" % name)
                      f.write("LAPORAN_JUDUL=%s\n" % (diag[0]["judul"].replace("\n", " ") if diag else "penyebab tidak dikenali otomatis"))


          if __name__ == "__main__":
              try:
                  main()
              except Exception as e:  # jangan sampai pembuat laporan menjatuhkan job
                  import traceback
                  traceback.print_exc()
                  with open(os.path.join(LOGS, "LAPORAN-ERROR-NOVA-ENGINE-run%s.txt" % RUN_TAG), "a") as f:
                      f.write("\n[PEMBUAT LAPORAN ERROR SENDIRI ERROR]\n%s\n" % traceback.format_exc())
                  sys.exit(0)
          PY

          # Cadangan: kalau pembuat laporan gagal total, tetap sediakan file .txt sederhana.
          ATT="${GITHUB_RUN_ATTEMPT:-1}"
          TAGN="${GITHUB_RUN_NUMBER}"; [ "$ATT" != "1" ] && TAGN="${GITHUB_RUN_NUMBER}-a${ATT}"
          OUT="$GITHUB_WORKSPACE/logs/LAPORAN-ERROR-NOVA-ENGINE-run${TAGN}.txt"
          if [ ! -s "$OUT" ]; then
            echo "Pembuat laporan gagal -> membuat laporan cadangan"
            {
              echo "LAPORAN ERROR (CADANGAN) — Nova Engine run #${GITHUB_RUN_NUMBER}"
              echo "Repo: $GITHUB_REPOSITORY  Commit: $GITHUB_SHA"
              echo "Status langkah (JSON):"; printf '%s\n' "$STEPS_JSON"
              for f in "$RUNNER_TEMP"/nova-steplogs/*.log; do
                [ -f "$f" ] || continue
                echo; echo "=== $(basename "$f") (300 baris akhir) ==="; tail -n 300 "$f"
              done
              for f in logs/lingkungan.txt logs/keluaran-build.txt logs/diagnostik-tambahan.txt; do
                [ -f "$f" ] && { echo; echo "=== $f ==="; cat "$f"; }
              done
            } > "$OUT" 2>&1
            { echo "LAPORAN_FILE=$OUT"; echo "LAPORAN_NAME=$(basename "$OUT")"; echo "LAPORAN_JUDUL=penyebab tidak dikenali otomatis (laporan cadangan)"; } >> "$GITHUB_ENV"
            head -n 400 "$OUT" > logs/RINGKASAN.txt
          fi
          echo "Isi logs/:"; ls -l logs | head -n 30
          echo "----- RINGKASAN (juga tersalin ke Summary) -----"
          head -n 120 logs/RINGKASAN.txt 2>/dev/null || true

      - name: Laporan error ke GitHub Release (.txt)
        id: laporan_release
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="${LAPORAN_FILE:-}"
          if [ -z "$FILE" ] || [ ! -s "$FILE" ]; then
            echo "Laporan tidak ada, Release dilewati."
            exit 0
          fi
          TAG="nova-error-$(basename "$FILE" .txt | sed 's/^LAPORAN-ERROR-NOVA-ENGINE-//')"
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          gh release create "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "[GAGAL] Laporan error Nova Engine (run #${GITHUB_RUN_NUMBER})" \
            --notes "Laporan error otomatis (.txt) untuk run #${GITHUB_RUN_NUMBER}. Dugaan penyebab: ${LAPORAN_JUDUL:-?}. Tautan run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "RELEASE_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$FILE")" >> "$GITHUB_ENV"
          echo "RELEASE_PAGE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_ENV"

          # Simpan hanya 5 rilis laporan error terbaru (tag berawalan nova-error-run).
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null \
            | grep '^nova-error-run' | tail -n +6 \
            | while read -r old; do
                gh release delete "$old" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
              done

      - name: Tampilkan laporan di Summary (bisa disalin)
        id: laporan_summary
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          {
            echo "## ❌ Laporan error — Nova Engine run #${GITHUB_RUN_NUMBER}"
            echo ""
            echo "**Dugaan penyebab:** ${LAPORAN_JUDUL:-tidak dikenali otomatis}"
            echo ""
            echo "**Ambil file .txt:**"
            echo "- Bagian **Artefak** di bawah halaman ini: \`${LAPORAN_NAME:-LAPORAN-ERROR-NOVA-ENGINE-run${GITHUB_RUN_NUMBER}.txt}\` (langsung .txt, tidak di-zip)"
            if [ -n "${RELEASE_URL:-}" ]; then
              echo "- Unduh langsung: ${RELEASE_URL}"
              echo "- Halaman rilis: ${RELEASE_PAGE:-}"
            else
              echo "- Tab **Releases** (jika pembuatan rilis berhasil)"
            fi
            echo ""
            echo "**Salin langsung:** tekan ikon salin di pojok kanan atas kotak di bawah, lalu tempel ke asisten AI."
            echo ""
            echo '````````text'
            if [ -f logs/RINGKASAN.txt ]; then head -c 600000 logs/RINGKASAN.txt; else echo "(ringkasan tidak tersedia)"; fi
            echo ""
            echo '````````'
            echo ""
            echo "_Versi lengkap (log tiap langkah, lingkungan, ekor log, daftar semua error) ada di file .txt._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload laporan error (.txt langsung)
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: logs/LAPORAN-ERROR-NOVA-ENGINE-run*.txt
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload log kegagalan
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: nova-engine-log-gagal
          path: logs/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

      # Jaga-jaga: kalau APK sudah jadi tapi verifikasi menggagalkan job,
      # APK-nya tetap diselamatkan supaya build berjam-jam tidak sia-sia.
      - name: Selamatkan APK yang belum terverifikasi
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nova-engine-apk-belum-terverifikasi
          path: hasil/*.apk
          if-no-files-found: ignore
          retention-days: 7
